<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings & Edit Profile | BelieversMeet</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/app-utils.js"></script>
    <script src="js/theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 flex flex-col" style="display: block !important;">
    <!-- Navigation Header -->
    <header class="bg-gradient-to-r from-blue-900 to-indigo-900 shadow-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 shrink-0">
                <a href="index.html" class="flex items-center space-x-2">
                    <img src="images/BELIEVERS.LOGO.png" alt="Logo" class="w-10 h-10 rounded-full object-cover border-2 border-white/20 shadow">
                    <span class="text-white font-bold text-lg tracking-tight">BelieversMeet</span>
                </a>
            </div>
            <!-- Desktop Navigation Links -->
            <nav class="hidden md:flex items-center space-x-6">
                <a href="feed.html" class="text-sm font-medium text-white/80 hover:text-white transition whitespace-nowrap">Feed</a>
                <a href="events.html" class="text-sm font-medium text-white/80 hover:text-white transition whitespace-nowrap">Events</a>
                <a href="sermons.html" class="text-sm font-medium text-white/80 hover:text-white transition whitespace-nowrap">Sermons & Media</a>
                <a href="giving.html" class="text-sm font-medium text-white/80 hover:text-white transition whitespace-nowrap">Giving</a>
                <a href="groups.html" class="text-sm font-medium text-white/80 hover:text-white transition whitespace-nowrap">Groups</a>
                <a href="admin.html" id="admin-nav-link" class="text-sm font-medium text-amber-300 hover:text-amber-200 transition hidden whitespace-nowrap">Admin Console</a>
            </nav>
            <!-- Mobile Navigation Container (Horizontal Scrollable) -->
            <div class="flex md:hidden overflow-x-auto whitespace-nowrap scrollbar-none items-center space-x-3 py-2 px-2 flex-grow mx-3 [-webkit-overflow-scrolling:touch] no-scrollbar">
                <a href="feed.html" class="text-xs font-medium text-white/80 hover:text-white transition whitespace-nowrap shrink-0">Feed</a>
                <a href="events.html" class="text-xs font-medium text-white/80 hover:text-white transition whitespace-nowrap shrink-0">Events</a>
                <a href="sermons.html" class="text-xs font-medium text-white/80 hover:text-white transition whitespace-nowrap shrink-0">Sermons & Media</a>
                <a href="giving.html" class="text-xs font-medium text-white/80 hover:text-white transition whitespace-nowrap shrink-0">Giving</a>
                <a href="groups.html" class="text-xs font-medium text-white/80 hover:text-white transition whitespace-nowrap shrink-0">Groups</a>
                <a href="admin.html" id="admin-nav-link-mobile" class="text-xs font-medium text-amber-300 hover:text-amber-200 transition hidden whitespace-nowrap shrink-0">Admin Console</a>
            </div>
            <div class="flex items-center space-x-3 shrink-0">
                <a href="profile.html" class="w-9 h-9 rounded-full bg-blue-700/50 text-white flex items-center justify-center font-bold text-sm border border-white/20 shadow">
                    <i class="fas fa-user"></i>
                </a>
                <button onclick="logoutUser(event)" class="text-white/80 hover:text-white p-2 rounded-lg transition" title="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-16 flex-grow w-full">
        <div class="bm-card">
            <h1 class="bm-page-heading mb-6 text-center justify-center">Edit Profile Settings</h1>
            
            <div class="flex flex-col items-center mb-6">
                <img id="avatar-preview" src="https://ui-avatars.com/api/?name=User" class="w-32 h-32 rounded-full object-cover mb-4 shadow border-2 border-blue-500" alt="Avatar">
            </div>

            <form id="settings-form" onsubmit="updateProfile(event)">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Account Role</label>
                    <input type="text" id="edit-role" disabled readonly class="bm-form-control bg-slate-800 cursor-not-allowed text-slate-400">
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Full Name</label>
                    <input type="text" id="edit-name" required class="bm-form-control">
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Church Affiliation</label>
                    <select id="church-select" class="bm-form-control bg-slate-900"></select>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Bio</label>
                    <textarea id="edit-bio" rows="4" class="bm-form-control resize-y" placeholder="Share a brief word about your walk..."></textarea>
                </div>
                
                <button type="submit" id="save-btn" class="bm-btn-primary w-full py-3">Save All Changes</button>
            </form>
            
            <div class="mt-8 pt-6 border-t border-slate-700">
                <h2 class="text-lg font-bold text-slate-100 mb-3">Update Profile Picture</h2>
                <input type="file" id="image-upload" accept="image/*" class="w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-600/20 file:text-blue-400 hover:file:bg-blue-600/30 file:cursor-pointer transition mb-4">
                <button onclick="uploadProfileImage()" id="upload-btn" class="bm-btn-secondary w-full py-2.5">Upload New Photo</button>
            </div>

            <div class="mt-8 pt-6 border-t border-slate-700 flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-bold text-slate-100">Platform Guidelines & Standards</h2>
                    <p class="text-sm text-slate-400">Read our community terms and rules.</p>
                </div>
                <button onclick="openTermsModal(event)" class="bm-btn-secondary">View Terms & Rules</button>
            </div>
        </div>
    </main>

    <script>
        async function loadProfile() {
            let attempts = 0;
            while (!window.sbClient && attempts < 15) {
                await new Promise(r => setTimeout(r, 200));
                attempts++;
            }

            const { data: { user } } = await window.sbClient.auth.getUser();
            if (!user) {
                window.location.replace('login.html');
                return;
            }

            const { data: profile } = await window.sbClient.from('profiles').select('*').eq('id', user.id).single();
            if (profile) {
                document.getElementById('edit-name').value = profile.full_name || '';
                document.getElementById('edit-role').value = profile.role || 'member';
                document.getElementById('edit-bio').value = profile.bio || '';
                if (profile.avatar_url) {
                    document.getElementById('avatar-preview').src = profile.avatar_url;
                } else if (profile.full_name) {
                    document.getElementById('avatar-preview').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(profile.full_name)}&background=10B981&color=fff`;
                }
                
                loadChurches(profile.church_id);
            }
        }

        async function loadChurches(selectedId) {
            const { data: churches } = await window.sbClient.from('churches').select('id, name');
            const select = document.getElementById('church-select');
            
            if (selectedId) {
                // If user is already linked, display current church and explain that changing membership requires an authorized process
                select.innerHTML = '';
                const matchedChurch = churches?.find(c => c.id === selectedId);
                const opt = document.createElement('option');
                opt.value = selectedId;
                opt.textContent = matchedChurch ? `${matchedChurch.name} (Linked)` : 'Current Linked Church';
                opt.selected = true;
                select.appendChild(opt);
                select.disabled = true;
                select.classList.add('bg-slate-800', 'cursor-not-allowed', 'text-slate-400');
                
                // Add explanatory banner/note if not already present
                let note = document.getElementById('church-locked-note');
                if (!note) {
                    note = document.createElement('p');
                    note.id = 'church-locked-note';
                    note.className = 'text-xs text-amber-400 mt-1';
                    note.textContent = 'Church membership is locked. Changing church membership requires an authorized process.';
                    select.parentNode.appendChild(note);
                }
            } else {
                select.innerHTML = '<option value="">Select a Church</option>';
                if (churches) {
                    churches.forEach(church => {
                        const opt = document.createElement('option');
                        opt.value = church.id;
                        opt.textContent = church.name;
                        select.appendChild(opt);
                    });
                }
            }
        }

        async function updateProfile(e) {
            e.preventDefault();
            const saveBtn = document.getElementById('save-btn');
            saveBtn.textContent = 'Saving...';
            saveBtn.disabled = true;

            const { data: { user } } = await window.sbClient.auth.getUser();

            // Fetch current profile to ensure we preserve church_id and never overwrite/nullify it from browser dropdown manipulation
            const { data: currentProfile } = await window.sbClient.from('profiles').select('church_id').eq('id', user.id).single();

            const updatePayload = {
                full_name: document.getElementById('edit-name').value.trim(),
                bio: document.getElementById('edit-bio').value.trim()
            };

            // Prevent ordinary profile-editing actions from changing an existing user's church_id or setting it to null
            if (currentProfile && currentProfile.church_id) {
                updatePayload.church_id = currentProfile.church_id;
            } else {
                const churchSelectVal = document.getElementById('church-select').value;
                if (churchSelectVal) {
                    updatePayload.church_id = churchSelectVal;
                }
            }

            const { error } = await window.sbClient.from('profiles').update(updatePayload).eq('id', user.id);

            saveBtn.textContent = 'Save All Changes';
            saveBtn.disabled = false;

            if (error) {
                alert('Error updating profile: ' + error.message);
            } else {
                alert('Profile updated successfully!');
                loadProfile();
            }
        }

        async function uploadProfileImage() {
            const file = document.getElementById('image-upload').files[0];
            if (!file) return alert("Please select a file first.");
            
            const uploadBtn = document.getElementById('upload-btn');
            uploadBtn.textContent = 'Uploading...';
            uploadBtn.disabled = true;

            const { data: { user } } = await window.sbClient.auth.getUser();
            const fileName = `${user.id}/profile_${Date.now()}.jpg`;
            
            const { error } = await window.sbClient.storage.from('avatars').upload(fileName, file, { upsert: true });
            if (error) {
                uploadBtn.textContent = 'Upload New Photo';
                uploadBtn.disabled = false;
                return alert("Upload failed: " + error.message);
            }
            
            const { data } = window.sbClient.storage.from('avatars').getPublicUrl(fileName);
            const { error: dbError } = await window.sbClient.from('profiles').update({ avatar_url: data.publicUrl }).eq('id', user.id);
            
            uploadBtn.textContent = 'Upload New Photo';
            uploadBtn.disabled = false;

            if (dbError) {
                alert("Error updating profile photo: " + dbError.message);
            } else {
                document.getElementById('avatar-preview').src = data.publicUrl;
                alert("Profile picture updated successfully!");
            }
        }

        async function logoutUser(e) {
            e.preventDefault();
            await window.sbClient.auth.signOut();
            window.location.replace('login.html');
        }

        function openTermsModal(e) {
            e.preventDefault();
            let modal = document.getElementById('terms-modal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'terms-modal';
                modal.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 p-4';
                modal.innerHTML = `
                    <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl overflow-y-auto max-h-[80vh]">
                        <div class="flex justify-between items-center mb-4 border-b pb-3">
                            <h3 class="text-xl font-bold text-gray-900"><i class="fas fa-file-contract text-emerald-600 mr-2"></i>Platform Terms & Community Rules</h3>
                            <button onclick="document.getElementById('terms-modal').remove()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
                        </div>
                        <div class="space-y-4 text-sm text-gray-600">
                            <p>Welcome to BelieversMeet. By registering and participating in our faith community, you agree to abide by the following standards:</p>
                            <h4 class="font-bold text-gray-900">1. Christian Character & Respect</h4>
                            <p>All members must treat others with Christ-like love, patience, and respect. Harassment, hate speech, bullying, or abusive behavior will result in immediate account deactivation.</p>
                            <h4 class="font-bold text-gray-900">2. Authentic Fellowship</h4>
                            <p>Accounts must represent real individuals or recognized fellowship groups. Impersonation or fraudulent representation is strictly prohibited.</p>
                            <h4 class="font-bold text-gray-900">3. Content Moderation & Violations</h4>
                            <p>Admins and users can report any breach of these terms using the "Report Violation" mechanism. Super Administrators hold final authority to review and block offending accounts.</p>
                        </div>
                        <div class="mt-6 text-right">
                            <button onclick="document.getElementById('terms-modal').remove()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-xl text-sm font-medium">Close</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
            }
        }

        loadProfile();
    </script>
  <script src="js/notifications.js"></script>
</body>
</html>
