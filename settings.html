<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings & Edit Profile | BelieversMeet</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="feed.html" class="text-xl font-bold text-emerald-600 flex-shrink-0 mr-4">BelieversMeet</a>
                <div<div class="flex overflow-x-auto whitespace-nowrap space-x-2 sm:space-x-4 py-2 px-4 w-full scroll-smooth [-webkit-overflow-scrolling:touch]"></div>
                    <a href="feed.html" class="text-xs sm:text-sm font-medium text-gray-600 hover:text-emerald-600 px-2 py-1 rounded-md transition-colors">My Feed</a>
                    <a href="giving.html" class="text-xs sm:text-sm font-medium text-gray-600 hover:text-emerald-600 px-2 py-1 rounded-md transition-colors">Giving</a>
                    <a href="prayer-wall.html" class="text-xs sm:text-sm font-medium text-gray-600 hover:text-emerald-600 px-2 py-1 rounded-md transition-colors">Prayer Wall</a>
                    <a href="testimonies.html" class="text-xs sm:text-sm font-medium text-gray-600 hover:text-emerald-600 px-2 py-1 rounded-md transition-colors">Testimonies</a>
                    <a href="inboxx.html" class="text-xs sm:text-sm font-medium text-gray-600 hover:text-emerald-600 px-2 py-1 rounded-md transition-colors">Inbox</a>
                    <a href="events.html" class="text-xs sm:text-sm font-medium text-gray-600 hover:text-emerald-600 px-2 py-1 rounded-md transition-colors">Events</a>
                    <a href="profile.html" class="text-xs sm:text-sm font-medium text-gray-600 hover:text-emerald-600 px-2 py-1 rounded-md transition-colors">Profile</a>
                    <a href="settings.html" class="text-xs sm:text-sm font-medium text-emerald-600 bg-emerald-50 px-2 py-1 rounded-md transition-colors">Settings</a>
                    <a href="admin.html" id="admin-nav-link" class="hidden text-xs sm:text-sm font-bold text-emerald-600 hover:bg-emerald-50 px-2 py-1 rounded-md transition-colors">⚙️ Admin Panel</a>
                    <a href="#" onclick="logoutUser(event)" class="text-xs sm:text-sm font-medium text-red-600 hover:bg-red-50 px-2 py-1 rounded-md transition-colors">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
        <div class="bg-white shadow rounded-lg p-6 sm:p-8">
            <h1 class="text-2xl font-bold text-gray-900 mb-6 text-center">Edit Profile Settings</h1>
            
            <div class="flex flex-col items-center mb-6">
                <img id="avatar-preview" src="https://ui-avatars.com/api/?name=User" class="w-32 h-32 rounded-full object-cover mb-4 shadow border-2 border-emerald-500" alt="Avatar">
            </div>

            <form id="settings-form" onsubmit="updateProfile(event)">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Account Role</label>
                    <input type="text" id="edit-role" disabled readonly class="w-full px-3 py-2 border border-gray-300 rounded-md bg-gray-100 cursor-not-allowed text-gray-500">
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
                    <input type="text" id="edit-name" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Church Affiliation</label>
                    <select id="church-select" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent bg-white"></select>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Bio</label>
                    <textarea id="edit-bio" rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent" placeholder="Share a brief word about your walk..."></textarea>
                </div>
                
                <button type="submit" id="save-btn" class="w-full py-3 px-4 bg-emerald-600 text-white font-medium rounded-md hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 transition-colors">Save All Changes</button>
            </form>
            
            <div class="mt-8 pt-6 border-t border-gray-200">
                <h2 class="text-lg font-medium text-gray-900 mb-3">Update Profile Picture</h2>
                <input type="file" id="image-upload" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-medium file:bg-emerald-50 file:text-emerald-600 hover:file:bg-emerald-100 mb-4">
                <button onclick="uploadProfileImage()" id="upload-btn" class="w-full py-2 px-4 bg-gray-100 text-gray-700 font-medium rounded-md hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition-colors">Upload New Photo</button>
            </div>

            <div class="mt-8 pt-6 border-t border-gray-200 flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-medium text-gray-900">Platform Guidelines & Standards</h2>
                    <p class="text-sm text-gray-500">Read our community terms and rules.</p>
                </div>
                <button onclick="openTermsModal(event)" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors">View Terms & Rules</button>
            </div>
        </div>
    </main>

    <script>
        async function loadProfile() {
            let attempts = 0;
            while (!window.sbClient && attempts < 15) {
                await new Promise(r => setTimeout(r, 200));
                attempts++;
            }

            const { data: { user } } = await window.sbClient.auth.getUser();
            if (!user) {
                window.location.replace('login.html');
                return;
            }

            const { data: profile } = await window.sbClient.from('profiles').select('*').eq('id', user.id).single();
            if (profile) {
                document.getElementById('edit-name').value = profile.full_name || '';
                document.getElementById('edit-role').value = profile.role || 'member';
                document.getElementById('edit-bio').value = profile.bio || '';
                if (profile.avatar_url) {
                    document.getElementById('avatar-preview').src = profile.avatar_url;
                } else if (profile.full_name) {
                    document.getElementById('avatar-preview').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(profile.full_name)}&background=10B981&color=fff`;
                }
                
                loadChurches(profile.church_id);
            }
        }

        async function loadChurches(selectedId) {
            const { data: churches } = await window.sbClient.from('churches').select('id, name');
            const select = document.getElementById('church-select');
            select.innerHTML = '<option value="">Select a Church</option>';
            if (churches) {
                churches.forEach(church => {
                    const opt = document.createElement('option');
                    opt.value = church.id;
                    opt.textContent = church.name;
                    if (church.id === selectedId) opt.selected = true;
                    select.appendChild(opt);
                });
            }
        }

        async function updateProfile(e) {
            e.preventDefault();
            const saveBtn = document.getElementById('save-btn');
            saveBtn.textContent = 'Saving...';
            saveBtn.disabled = true;

            const { data: { user } } = await window.sbClient.auth.getUser();
            const { error } = await window.sbClient.from('profiles').update({
                full_name: document.getElementById('edit-name').value.trim(),
                church_id: document.getElementById('church-select').value || null,
                bio: document.getElementById('edit-bio').value.trim()
            }).eq('id', user.id);

            saveBtn.textContent = 'Save All Changes';
            saveBtn.disabled = false;

            if (error) {
                alert('Error updating profile: ' + error.message);
            } else {
                alert('Profile updated successfully!');
                loadProfile();
            }
        }

        async function uploadProfileImage() {
            const file = document.getElementById('image-upload').files[0];
            if (!file) return alert("Please select a file first.");
            
            const uploadBtn = document.getElementById('upload-btn');
            uploadBtn.textContent = 'Uploading...';
            uploadBtn.disabled = true;

            const { data: { user } } = await window.sbClient.auth.getUser();
            const fileName = `${user.id}/profile_${Date.now()}.jpg`;
            
            const { error } = await window.sbClient.storage.from('avatars').upload(fileName, file, { upsert: true });
            if (error) {
                uploadBtn.textContent = 'Upload New Photo';
                uploadBtn.disabled = false;
                return alert("Upload failed: " + error.message);
            }
            
            const { data } = window.sbClient.storage.from('avatars').getPublicUrl(fileName);
            const { error: dbError } = await window.sbClient.from('profiles').update({ avatar_url: data.publicUrl }).eq('id', user.id);
            
            uploadBtn.textContent = 'Upload New Photo';
            uploadBtn.disabled = false;

            if (dbError) {
                alert("Error updating profile photo: " + dbError.message);
            } else {
                document.getElementById('avatar-preview').src = data.publicUrl;
                alert("Profile picture updated successfully!");
            }
        }

        async function logoutUser(e) {
            e.preventDefault();
            await window.sbClient.auth.signOut();
            window.location.replace('login.html');
        }

        function openTermsModal(e) {
            e.preventDefault();
            let modal = document.getElementById('terms-modal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'terms-modal';
                modal.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 p-4';
                modal.innerHTML = `
                    <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl overflow-y-auto max-h-[80vh]">
                        <div class="flex justify-between items-center mb-4 border-b pb-3">
                            <h3 class="text-xl font-bold text-gray-900"><i class="fas fa-file-contract text-emerald-600 mr-2"></i>Platform Terms & Community Rules</h3>
                            <button onclick="document.getElementById('terms-modal').remove()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
                        </div>
                        <div class="space-y-4 text-sm text-gray-600">
                            <p>Welcome to BelieversMeet. By registering and participating in our faith community, you agree to abide by the following standards:</p>
                            <h4 class="font-bold text-gray-900">1. Christian Character & Respect</h4>
                            <p>All members must treat others with Christ-like love, patience, and respect. Harassment, hate speech, bullying, or abusive behavior will result in immediate account deactivation.</p>
                            <h4 class="font-bold text-gray-900">2. Authentic Fellowship</h4>
                            <p>Accounts must represent real individuals or recognized fellowship groups. Impersonation or fraudulent representation is strictly prohibited.</p>
                            <h4 class="font-bold text-gray-900">3. Content Moderation & Violations</h4>
                            <p>Admins and users can report any breach of these terms using the "Report Violation" mechanism. Super Administrators hold final authority to review and block offending accounts.</p>
                        </div>
                        <div class="mt-6 text-right">
                            <button onclick="document.getElementById('terms-modal').remove()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-xl text-sm font-medium">Close</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
            }
        }

        loadProfile();
    </script>
</body>
</html>
