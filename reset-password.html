<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | BelieversMeet</title>
    <!-- Tailwind CSS CDN -->
    
            <link rel="stylesheet" href="css/style.css">
</head>
<body class="h-full flex flex-col justify-between font-sans antialiased text-gray-900">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-gray-200">
        <div class="glass-card floating-card glass-card floating-card max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-bold text-indigo-600 hover:text-indigo-500">BelieversMeet</a>
            <div class="text-sm">
                <span class="text-gray-500">Remembered your password?</span>
                <a href="login.html" class="ml-1 font-medium text-indigo-600 hover:text-indigo-500">Log In</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="glass-card floating-card glass-card floating-card max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-lg border border-gray-100">
            <div>
                <h2 class="text-center text-3xl font-extrabold text-gray-900">Create New Password</h2>
                <p class="mt-2 text-center text-sm text-gray-600">
                    Please enter your new password below.
                </p>
            </div>

            <div id="error-message" class="hidden rounded-md bg-red-50 p-4 text-sm text-red-700 border border-red-200"></div>
            <div id="success-message" class="hidden rounded-md bg-green-50 p-4 text-sm text-green-700 border border-green-200"></div>

            <form id="reset-form" class="mt-8 space-y-5">
                <div>
                    <label for="new-password" class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
                    <div class="relative">
                        <input type="password" id="new-password" required class="appearance-none rounded-lg relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm pr-16" placeholder="At least 6 characters">
                        <button type="button" onclick="toggleVisibility()" class="absolute inset-y-0 right-0 px-3 flex items-center text-xs font-medium text-indigo-600 hover:text-indigo-500 focus:outline-none">Show/Hide</button>
                    </div>
                </div>

                <div>
                    <button type="submit" class="group relative w-full flex justify-center py-2.5 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                        Update Password
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-auto py-6">
      <div class="glass-card floating-card glass-card floating-card max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-gray-500">
        &copy; 2026 BelieversMeet. All rights reserved. Building and strengthening faith communities together.
      </div>
    </footer>

    <!-- Script Section -->
    <script>
        async function waitForSupabase() {
            while (!window.sbClient) await new Promise(r => setTimeout(r, 100));
            return true;
        }

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errBox = document.getElementById('error-message');
            const succBox = document.getElementById('success-message');
            errBox.classList.add('hidden');
            succBox.classList.add('hidden');

            await waitForSupabase();

            const btn = document.querySelector('button[type="submit"]');
            const newPassword = document.getElementById('new-password').value;

            if (!newPassword || newPassword.length < 6) {
                errBox.textContent = "Please enter a password of at least 6 characters.";
                errBox.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.textContent = "Updating Password...";

            try {
                const { data, error } = await window.sbClient.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                succBox.textContent = "Password updated successfully! Redirecting to login...";
                succBox.classList.remove('hidden');
                
                setTimeout(() => {
                    window.location.replace('login.html');
                }, 2000);
            } catch (err) {
                errBox.textContent = err.message;
                errBox.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = "Update Password";
            }
        });

        function toggleVisibility() {
            const p = document.getElementById('new-password');
            p.type = p.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
