<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | BelieversMeet</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
</head>
<body class="bg-slate-950 bg-[url('https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=2000&q=80')] bg-cover bg-center bg-no-repeat bg-fixed min-h-screen flex flex-col justify-between font-sans antialiased text-slate-100 relative">

    <!-- Dark Overlay for Readability -->
    <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-md z-0 pointer-events-none"></div>

    <!-- Header / Navbar -->
    <header class="bg-slate-950/90 backdrop-blur-xl border-b border-slate-800/80 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 group">
                <img src="images/BELIEVERS.LOGO.png" alt="Logo" class="h-10 w-auto object-contain transform group-hover:scale-105 transition duration-300">
                <span class="text-xl font-black bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">BelieversMeet</span>
            </a>
            <div class="text-sm">
                <span class="text-slate-400">Remembered your password?</span>
                <a href="login.html" class="ml-1 font-medium text-blue-400 hover:text-blue-300 transition underline">Log In</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative z-10">
        <div class="max-w-md w-full space-y-8 bg-slate-900/90 p-8 shadow-2xl rounded-2xl border border-slate-800 backdrop-blur-xl">
            <div>
                <h2 class="text-center text-3xl font-extrabold text-white">Reset Password</h2>
                <p class="mt-2 text-center text-sm text-slate-400">
                    Enter your email address and we'll send you a link to reset your password.
                </p>
            </div>

            <div id="error-message" class="hidden rounded-xl bg-red-950/50 p-4 text-sm text-red-300 border border-red-800/60"></div>
            <div id="success-message" class="hidden rounded-xl bg-emerald-950/50 p-4 text-sm text-emerald-300 border border-emerald-800/60"></div>

            <form id="reset-form" class="mt-8 space-y-5">
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-300 mb-1">Email Address</label>
                    <input type="email" id="email" required class="bm-form-control bg-slate-800/90 border-slate-700 text-white placeholder-slate-500 focus:border-blue-500 focus:ring-blue-500/20" placeholder="name@domain.com">
                </div>

                <div>
                    <button type="submit" class="bm-btn-primary w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl shadow-lg transition-all">
                        Send Reset Link
                    </button>
                </div>

                <div class="text-center pt-2">
                    <a href="login.html" class="text-sm font-medium text-blue-400 hover:text-blue-300 transition">&larr; Back to Login</a>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950/90 border-t border-slate-800/80 mt-auto py-6 relative z-10">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-slate-400">
        &copy; 2026 BelieversMeet. All rights reserved. Building and strengthening faith communities together.
      </div>
    </footer>

    <!-- Script Section -->
    <script>
        async function waitForSupabase() {
    for (let attempts = 0; attempts < 100; attempts++) {
        const client = window.sbClient || window.supabaseClient;

        if (client?.auth) {
            return client;
        }

        await new Promise(resolve => setTimeout(resolve, 100));
    }

    throw new Error('Supabase authentication is not available. Please refresh the page.');
}
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errBox = document.getElementById('error-message');
            const succBox = document.getElementById('success-message');
            errBox.classList.add('hidden');
            succBox.classList.add('hidden');

            const sb = await waitForSupabase();

            const btn = document.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = "Sending Link...";

            const email = document.getElementById('email').value.trim();

            try {
                const { error } = await sb.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/reset-password.html',
                });

                if (error) throw error;

                succBox.textContent = "Password reset instructions have been sent to your email.";
                succBox.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = "Send Reset Link";
                document.getElementById('reset-form').reset();
            } catch (err) {
                errBox.textContent = err.message;
                errBox.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = "Send Reset Link";
            }
        });
    </script>
  <script src="js/notifications.js"></script>
</body>
</html>
