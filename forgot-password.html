<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | BelieversMeet</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
</head>
<body class="bg-[url('images/roo-background.jpg.png')] bg-cover bg-center bg-no-repeat bg-fixed min-h-screen flex flex-col justify-between font-sans antialiased text-gray-900 relative">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-bold text-indigo-600 hover:text-indigo-500">BelieversMeet</a>
            <div class="text-sm">
                <span class="text-gray-500">Remembered your password?</span>
                <a href="login.html" class="ml-1 font-medium text-indigo-600 hover:text-indigo-500">Log In</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8 backdrop-blur-md bg-white/90 dark:bg-slate-900/90 p-8 shadow-2xl rounded-2xl border border-white/20">
            <div>
                <h2 class="text-center text-3xl font-extrabold text-gray-900">Reset Password</h2>
                <p class="mt-2 text-center text-sm text-gray-600">
                    Enter your email address and we'll send you a link to reset your password.
                </p>
            </div>

            <div id="error-message" class="hidden rounded-md bg-red-50 p-4 text-sm text-red-700 border border-red-200"></div>
            <div id="success-message" class="hidden rounded-md bg-green-50 p-4 text-sm text-green-700 border border-green-200"></div>

            <form id="reset-form" class="mt-8 space-y-5">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="email" required class="appearance-none rounded-lg relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="name@domain.com">
                </div>

                <div>
                    <button type="submit" class="group relative w-full flex justify-center py-2.5 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                        Send Reset Link
                    </button>
                </div>

                <div class="text-center pt-2">
                    <a href="login.html" class="text-sm font-medium text-indigo-600 hover:text-indigo-500">&larr; Back to Login</a>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-auto py-6">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-gray-500">
        &copy; 2026 BelieversMeet. All rights reserved. Building and strengthening faith communities together.
      </div>
    </footer>

    <!-- Script Section -->
    <script>
        async function waitForSupabase() {
            while (!window.sbClient) await new Promise(r => setTimeout(r, 100));
            return true;
        }

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errBox = document.getElementById('error-message');
            const succBox = document.getElementById('success-message');
            errBox.classList.add('hidden');
            succBox.classList.add('hidden');

            await waitForSupabase();

            const btn = document.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = "Sending Link...";

            const email = document.getElementById('email').value.trim();

            try {
                const { error } = await window.sbClient.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/reset-password.html',
                });

                if (error) throw error;

                succBox.textContent = "Password reset instructions have been sent to your email.";
                succBox.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = "Send Reset Link";
                document.getElementById('reset-form').reset();
            } catch (err) {
                errBox.textContent = err.message;
                errBox.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = "Send Reset Link";
            }
        });
    </script>
</body>
</html>
