<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | BelieversMeet</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex flex-col justify-between font-sans antialiased text-gray-900">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-bold text-indigo-600 hover:text-indigo-500">BelieversMeet</a>
            <div class="text-sm">
                <span class="text-gray-500">Already have an account?</span>
                <a href="login.html" class="ml-1 font-medium text-indigo-600 hover:text-indigo-500">Log In</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-lg border border-gray-100">
            <div>
                <h2 class="text-center text-3xl font-extrabold text-gray-900">Join BelieversMeet</h2>
                <p class="mt-2 text-center text-sm text-gray-600">
                    Connect with your faith community and grow together.
                </p>
            </div>

            <div id="error-message" class="hidden rounded-md bg-red-50 p-4 text-sm text-red-700 border border-red-200"></div>

            <form id="signup-form" class="mt-8 space-y-5">
                <div>
                    <label for="full-name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                    <input type="text" id="full-name" required class="appearance-none rounded-lg relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="John Doe">
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="email" required class="appearance-none rounded-lg relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="you@example.com">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <input type="password" id="password" required class="appearance-none rounded-lg relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm pr-16" placeholder="••••••••">
                        <button type="button" onclick="togglePasswordVisibility('password')" class="absolute inset-y-0 right-0 px-3 flex items-center text-xs font-medium text-indigo-600 hover:text-indigo-500 focus:outline-none">Show/Hide</button>
                    </div>
                </div>

                <div>
                    <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                    <div class="relative">
                        <input type="password" id="confirm-password" required class="appearance-none rounded-lg relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm pr-16" placeholder="••••••••">
                        <button type="button" onclick="togglePasswordVisibility('confirm-password')" class="absolute inset-y-0 right-0 px-3 flex items-center text-xs font-medium text-indigo-600 hover:text-indigo-500 focus:outline-none">Show/Hide</button>
                    </div>
                </div>

                <div>
                    <label for="role-select" class="block text-sm font-medium text-gray-700 mb-1">Account Type</label>
                    <select id="role-select" required class="block w-full px-3 py-2 border border-gray-300 bg-white rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                        <option value="member" selected>Member</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <div id="church-select-container">
                    <label for="church-select" class="block text-sm font-medium text-gray-700 mb-1">Affiliated Church</label>
                    <select id="church-select" class="block w-full px-3 py-2 border border-gray-300 bg-white rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                        <option value="">Loading churches...</option>
                    </select>
                </div>

                <div>
                    <button type="submit" class="group relative w-full flex justify-center py-2.5 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                        Sign Up
                    </button>
                </div>

                <div class="text-center pt-2">
                    <p class="text-xs text-gray-500">
                        Looking to register an entire church? 
                        <a href="register-church.html" class="font-medium text-indigo-600 hover:text-indigo-500">Click here</a>
                    </p>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-auto py-6">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-gray-500">
        &copy; 2026 BelieversMeet. All rights reserved. Building and strengthening faith communities together.
      </div>
    </footer>

    <!-- Script Section -->
    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
        import { collection, getDocs, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

        async function loadChurches() {
            const select = document.getElementById('church-select');
            try {
                const querySnapshot = await getDocs(collection(db, "churches"));
                select.innerHTML = '<option value="">-- Choose your Church --</option>';
                querySnapshot.forEach((docSnap) => {
                    const c = docSnap.data();
                    const opt = document.createElement('option');
                    opt.value = docSnap.id;
                    opt.textContent = c.name || 'Unnamed Church';
                    select.appendChild(opt);
                });
            } catch (error) {
                console.error(error);
                select.innerHTML = '<option value="">Error loading churches</option>';
            }
        }

        window.togglePasswordVisibility = function(fieldId) {
            const inputField = document.getElementById(fieldId);
            inputField.type = inputField.type === 'password' ? 'text' : 'password';
        };

        document.getElementById('role-select').addEventListener('change', (e) => {
            const role = e.target.value;
            const churchContainer = document.getElementById('church-select-container');
            const churchSelect = document.getElementById('church-select');
            if (role === 'admin') {
                churchContainer.classList.add('hidden');
                churchSelect.removeAttribute('required');
                churchSelect.value = '';
            } else {
                churchContainer.classList.remove('hidden');
                churchSelect.setAttribute('required', 'required');
            }
        });

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errBox = document.getElementById('error-message');
            errBox.classList.add('hidden');

            const btn = document.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = "Creating Account...";

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const fullName = document.getElementById('full-name').value.trim();
            const role = document.getElementById('role-select').value;
            const churchId = document.getElementById('church-select').value;

            if (password !== confirmPassword) {
                errBox.textContent = "Passwords do not match.";
                errBox.classList.remove('hidden');
                btn.disabled = false; 
                btn.textContent = "Sign Up";
                return;
            }

            if (role === 'member' && !churchId) {
                errBox.textContent = "Please select your church.";
                errBox.classList.remove('hidden');
                btn.disabled = false; 
                btn.textContent = "Sign Up";
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                const profileData = {
                    id: user.uid,
                    full_name: fullName,
                    role: role,
                    is_verified: false,
                    createdAt: new Date().toISOString()
                };

                if (role === 'member') {
                    profileData.church_id = churchId;
                    profileData.churchId = churchId;
                }

                await setDoc(doc(db, "users", user.uid), profileData);

                if (role === 'admin') {
                    window.location.replace('register-church.html');
                } else {
                    window.location.replace('feed.html');
                }
            } catch (err) {
                console.error(err);
                errBox.textContent = "Error: " + err.message;
                errBox.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = "Sign Up";
            }
        });

        loadChurches();
    </script>
</body>
</html>
