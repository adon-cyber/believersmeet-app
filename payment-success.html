<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Successful | BelieversMeet</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex flex-col items-center justify-center font-sans text-slate-100 bg-slate-900 antialiased p-4">

    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 text-center text-gray-900">
        <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl shadow-inner animate-bounce">
            <i class="fas fa-heart"></i>
        </div>
        
        <h1 class="text-3xl font-black text-gray-900 mb-2">Thank You!</h1>
        <p class="text-gray-600 text-sm mb-6 leading-relaxed">
            Your generous donation and worship through giving has been received successfully. May God bless you abundantly!
        </p>

        <div id="transaction-details" class="bg-gray-50 rounded-xl p-4 text-left text-xs space-y-2 mb-8 border border-gray-100 hidden">
            <div class="flex justify-between"><span class="text-gray-500">Tracking ID:</span> <span id="display-tracking-id" class="font-mono font-bold text-gray-800"></span></div>
            <div class="flex justify-between"><span class="text-gray-500">Reference:</span> <span id="display-reference" class="font-mono font-bold text-gray-800"></span></div>
            <div class="flex justify-between"><span class="text-gray-500">Status:</span> <span class="font-bold text-emerald-600 uppercase">Successful</span></div>
        </div>

        <div class="space-y-3">
            <a href="feed.html" class="block w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg transition-all text-center">
                <i class="fas fa-home mr-2"></i> Return to Feed
            </a>
            <a href="giving.html" class="block w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3 px-6 rounded-xl transition-all text-center text-sm">
                Make Another Gift
            </a>
        </div>
    </div>

    <script>
        // Parse URL parameters from Pesapal return callback
        const urlParams = new URLSearchParams(window.location.search);
        const orderTrackingId = urlParams.get('OrderTrackingId');
        const orderMerchantReference = urlParams.get('OrderMerchantReference');

        if (orderTrackingId || orderMerchantReference) {
            const detailsBox = document.getElementById('transaction-details');
            if (detailsBox) detailsBox.classList.remove('hidden');

            if (orderTrackingId) {
                document.getElementById('display-tracking-id').innerText = orderTrackingId;
            }
            if (orderMerchantReference) {
                document.getElementById('display-reference').innerText = orderMerchantReference;
            }
        }
    </script>
</body>
</html>
