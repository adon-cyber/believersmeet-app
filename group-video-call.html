<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Group Video Call | BelieversMeet</title>
    <link rel="icon" href="images/BELIEVERS.LOGO.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/church-branding.js"></script>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; background:#0b1220; color:#f8fafc; font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif; }
        .page { max-width:1400px; margin:0 auto; padding:20px; }
        .topbar { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
        .brand { color:#fff; text-decoration:none; font-weight:800; }
        .muted { color:#94a3b8; }
        .status { color:#bfdbfe; font-size:14px; min-height:22px; }
        .stage { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr)); gap:14px; }
        .tile { min-height:240px; aspect-ratio:16/10; background:#111827; border:1px solid #334155; border-radius:16px; overflow:hidden; position:relative; }
        .tile video { width:100%; height:100%; object-fit:cover; }
        .tile-label { position:absolute; left:12px; bottom:12px; background:#020617bb; padding:6px 10px; border-radius:999px; font-size:12px; z-index:3; }
        .placeholder { position:absolute; inset:0; display:grid; place-items:center; color:#94a3b8; text-align:center; padding:18px; }
        .controls { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:20px auto; }
        button { border:0; border-radius:999px; padding:12px 18px; font-weight:700; cursor:pointer; background:#1d4ed8; color:#fff; }
        button:disabled { opacity:.55; cursor:not-allowed; }
        .secondary { background:#334155; }
        .danger { background:#dc2626; }
        .hidden { display:none !important; }
        .notice { margin:14px 0; border:1px solid #334155; border-radius:12px; background:#111827; padding:12px 14px; color:#cbd5e1; }
        @media(max-width:600px){ .page{padding:14px}.tile{min-height:210px} }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/believersmeet-brand.css?v=20261127-v2">
</head>
<body>
    <main class="page">
        <div class="topbar">
            <a class="brand" id="back-link" href="groups.html"><img data-bm-church-logo src="images/BELIEVERS.LOGO.png" alt="Church logo" width="32" height="32" style="vertical-align:middle;border-radius:50%;margin-right:8px">BelieversMeet · Groups</a>
            <div class="muted" id="group-name">Joining group call…</div>
        </div>
        <div id="call-status" class="status" role="status" aria-live="polite">Checking your group-call access…</div>
        <div id="call-error" class="notice hidden" role="alert"></div>
        <div id="call-stage" class="stage">
            <section class="tile" id="local-tile">
                <div id="local-player" class="placeholder">Your camera will appear here.</div>
                <span class="tile-label">You</span>
            </section>
        </div>
        <div id="remote-grid" class="stage" aria-live="polite">
            <div class="notice" id="remote-empty">Waiting for group members to join…</div>
        </div>
        <div class="controls">
            <button id="mic-toggle" class="secondary" type="button" disabled>Mute microphone</button>
            <button id="camera-toggle" class="secondary" type="button" disabled>Turn camera off</button>
            <button id="leave-call" class="danger" type="button">Leave call</button>
            <button id="end-call" class="danger hidden" type="button">End call for everyone</button>
        </div>
        <p class="muted" style="text-align:center;font-size:12px">Calls are limited to approved members of this church group. Camera and microphone access require browser permission and a secure HTTPS connection.</p>
    </main>
    <script src="js/group-video-call.js"></script>
</body>
</html>
