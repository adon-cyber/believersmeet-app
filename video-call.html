<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Video Call | BelieversMeet</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Main Viewport Container */
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #1a1a1a;
        }

        /* Remote stream takes up the whole backdrop */
        .remote-stream {
            width: 100%;
            height: 100%;
            background-color: #242424;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .placeholder-text {
            color: #a0a0a0;
            font-size: 1.2rem;
            font-weight: 500;
            text-align: center;
            padding: 20px;
        }

        /* Floating Local Preview (Your Camera) */
        .local-stream {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 180px;
            height: 240px;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.15);
            z-index: 10;
            transition: all 0.3s ease;
        }

        @media (max-width: 600px) {
            .local-stream {
                width: 120px;
                height: 160px;
                top: 16px;
                right: 16px;
            }
        }

        /* Controls Overlay Bar */
        .controls-bar {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            background-color: rgba(30, 30, 30, 0.75);
            padding: 12px 24px;
            border-radius: 40px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 20;
        }

        .control-btn {
            background-color: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 12px 20px;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background-color 0.2s, transform 0.1s;
        }

        .control-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .control-btn.muted {
            background-color: #ea4335;
        }

        .leave-btn {
            background-color: #ea4335;
        }

        .leave-btn:hover {
            background-color: #d93025;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <div id="remote-player" class="remote-stream">
            <div class="placeholder-text">Waiting for someone to join...</div>
        </div>

        <div id="local-player" class="local-stream"></div>

        <div class="controls-bar">
            <button id="btn-mic" class="control-btn">Mute Mic</button>
            <button id="btn-cam" class="control-btn">Camera Off</button>
            <button id="btn-leave" class="control-btn leave-btn">End Call</button>
        </div>
    </div>

<script>
(() => {
    'use strict';

    const UUID_PATTERN =
        /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

    const invitationId = new URLSearchParams(window.location.search)
        .get('invitation');

    const remotePlayer = document.getElementById('remote-player');
    const localPlayer = document.getElementById('local-player');
    const micButton = document.getElementById('btn-mic');
    const cameraButton = document.getElementById('btn-cam');
    const leaveButton = document.getElementById('btn-leave');

    const supabaseClient = window.sbClient || window.supabaseClient;

    let currentUserId = null;
    let invitation = null;
    let invitationChannel = null;
    let rtcClient = null;
    let rtcCredentials = null;

    let audioTrack = null;
    let videoTrack = null;

    let joined = false;
    let joining = false;
    let ending = false;
    let terminal = false;
    let renewingToken = false;
    let muted = false;
    let cameraDisabled = false;
    let expiryTimer = null;

    function showMessage(message, isError = false) {
        remotePlayer.replaceChildren();

        const element = document.createElement('div');
        element.className = 'placeholder-text';
        element.textContent = message;

        if (isError) element.style.color = '#ea4335';

        remotePlayer.appendChild(element);
    }

    function setControlsEnabled(enabled) {
        micButton.disabled = !enabled;
        cameraButton.disabled = !enabled;
    }

    async function getInvitation() {
        const { data, error } = await supabaseClient
            .from('video_call_invitations')
            .select('id, caller_id, recipient_id, status, expires_at')
            .eq('id', invitationId)
            .maybeSingle();

        if (error) throw error;
        if (!data) throw new Error('Call invitation not found or access denied.');

        if (
            data.caller_id !== currentUserId &&
            data.recipient_id !== currentUserId
        ) {
            throw new Error('You are not a participant in this call.');
        }

        return data;
    }

    async function requestAgoraToken() {
        const { data, error } = await supabaseClient.functions.invoke(
            'agora-token',
            {
                body: { invitationId }
            }
        );

        if (error) {
            throw new Error(error.message || 'Could not obtain Agora authorization.');
        }

        if (
            !data ||
            data.invitationId !== invitationId ||
            typeof data.appId !== 'string' ||
            typeof data.token !== 'string' ||
            typeof data.channelName !== 'string' ||
            !Number.isSafeInteger(data.uid) ||
            !Number.isFinite(Number(data.expiresAt)) ||
            Number(data.expiresAt) <= 0
        ) {
            throw new Error('The Agora authorization response is invalid or expired.');
        }

        return data;
    }

    async function releaseMedia() {
        setControlsEnabled(false);

        if (audioTrack) {
            audioTrack.close();
            audioTrack = null;
        }

        if (videoTrack) {
            videoTrack.close();
            videoTrack = null;
        }

        if (rtcClient && joined) {
            try {
                await rtcClient.leave();
            } catch (error) {
                console.warn('Agora leave warning:', error);
            }
        }

        joined = false;
    }

    async function renewAgoraToken() {
        if (!joined || renewingToken || terminal) return;

        renewingToken = true;

        try {
            const fresh = await requestAgoraToken();

            if (
                fresh.appId !== rtcCredentials.appId ||
                fresh.channelName !== rtcCredentials.channelName ||
                fresh.uid !== rtcCredentials.uid
            ) {
                throw new Error('Agora call identity changed during token renewal.');
            }

            await rtcClient.renewToken(fresh.token);

            rtcCredentials = fresh;

            console.log('Agora token renewed successfully.');
        } catch (error) {
            console.error('Agora token renewal failed:', error);
            showMessage(
                'Connection authorization renewal failed. Please check your connection.',
                true
            );
        } finally {
            renewingToken = false;
        }
    }

    async function startAcceptedCall() {
        if (joined || joining || terminal) return;

        joining = true;

        try {
            showMessage('Connecting your camera and microphone...');

            // The Agora Edge Function rechecks the invitation lease
            // using the database clock before issuing credentials.
            if (
                !invitation ||
                invitation.status !== 'accepted'
            ) {
                throw new Error('This video call is no longer active.');
            }

            if (!window.AgoraRTC) {
                throw new Error('Agora video service did not load.');
            }

            rtcCredentials = await requestAgoraToken();

            rtcClient = AgoraRTC.createClient({
                mode: 'rtc',
                codec: 'vp8'
            });

            rtcClient.on('user-published', async (remoteUser, mediaType) => {
                await rtcClient.subscribe(remoteUser, mediaType);

                if (mediaType === 'video') {
                    remotePlayer.replaceChildren();
                    remoteUser.videoTrack.play('remote-player');
                }

                if (mediaType === 'audio') {
                    remoteUser.audioTrack.play();
                }
            });

            rtcClient.on('user-left', () => {
                if (!terminal) {
                    showMessage('The other participant left the call.');
                }
            });

            rtcClient.on('token-privilege-will-expire', () => {
                void renewAgoraToken();
            });

            audioTrack = await AgoraRTC.createMicrophoneAudioTrack();
            videoTrack = await AgoraRTC.createCameraVideoTrack();

            await rtcClient.join(
                rtcCredentials.appId,
                rtcCredentials.channelName,
                rtcCredentials.token,
                rtcCredentials.uid
            );

            joined = true;

            videoTrack.play(localPlayer);
            await rtcClient.publish([audioTrack, videoTrack]);

            setControlsEnabled(true);
            showMessage('Waiting for the other participant to connect...');

            console.log('Joined the authorized Agora invitation channel.');

        } catch (error) {
            console.error('Agora call startup failed:', error);

            await releaseMedia();

            showMessage(
                error.message || 'Unable to start this video call.',
                true
            );

        } finally {
            joining = false;
        }
    }

    async function finishFromInvitation(status) {
        if (terminal) return;

        terminal = true;

        if (expiryTimer) clearTimeout(expiryTimer);

        await releaseMedia();

        const messages = {
            declined: 'The other participant declined the call.',
            cancelled: 'The video-call invitation was cancelled.',
            ended: 'The video call has ended.',
            expired: 'The video-call invitation has expired.'
        };

        showMessage(messages[status] || 'This video call is no longer active.');

        leaveButton.textContent = 'Return to Chat';
    }

    function scheduleLeaseCheck(expectedStatus) {
        if (expiryTimer) clearTimeout(expiryTimer);

        // PostgreSQL decides expiry. This timer only determines
        // when the browser asks the database to check again.
        expiryTimer = setTimeout(() => {
            void expireInvitationLease(expectedStatus);
        }, 15000);
    }

    async function processInvitation(updatedInvitation) {
        invitation = updatedInvitation;

        if (
            ['declined', 'cancelled', 'ended', 'expired'].includes(
                invitation.status
            )
        ) {
            await finishFromInvitation(invitation.status);
            return;
        }

        if (invitation.status === 'accepted') {
            scheduleLeaseCheck('accepted');
            await startAcceptedCall();
            return;
        }

        if (invitation.status === 'ringing') {
            showMessage('Calling... Waiting for the other participant to accept.');
            scheduleLeaseCheck('ringing');
        }
    }

    async function expireInvitationLease(expectedStatus) {
        if (
            terminal ||
            !invitation ||
            invitation.status !== expectedStatus
        ) {
            return;
        }

        try {
            // The RPC locks the row and uses PostgreSQL's clock.
            // The browser clock never decides whether the call has expired.
            const { data: currentStatus, error } = await supabaseClient.rpc(
                'expire_video_call_invitation',
                {
                    p_invitation_id: invitationId
                }
            );

            if (error) throw error;

            if (typeof currentStatus !== 'string') {
                throw new Error('The expiry service returned an invalid status.');
            }

            if (
                ['declined', 'cancelled', 'ended', 'expired'].includes(
                    currentStatus
                )
            ) {
                await finishFromInvitation(currentStatus);
                return;
            }

            if (!['ringing', 'accepted'].includes(currentStatus)) {
                throw new Error('The expiry service returned an unknown status.');
            }

            if (currentStatus !== expectedStatus) {
                await refreshInvitation();
                return;
            }

            // The database confirms the lease is still active.
            // Check again later without relying on the local system clock.
            scheduleLeaseCheck(currentStatus);

        } catch (error) {
            console.error('Database-authoritative expiry check failed:', error);

            // Retry safely if the network or database is temporarily unavailable.
            scheduleLeaseCheck(expectedStatus);
        }
    }
    async function refreshInvitation() {
        const freshInvitation = await getInvitation();
        await processInvitation(freshInvitation);
    }

    async function endCall() {
        if (terminal) {
            window.location.replace('chat.html');
            return;
        }

        if (ending) return;

        ending = true;
        leaveButton.disabled = true;
        leaveButton.textContent = 'Ending...';

        try {
            const { error } = await supabaseClient.rpc(
                'end_video_call_invitation',
                {
                    p_invitation_id: invitationId
                }
            );

            if (error) throw error;

            await refreshInvitation();

        } catch (error) {
            console.error('Unable to end video call:', error);

            await releaseMedia();

            showMessage(
                error.message || 'The call could not be ended on the server.',
                true
            );

        } finally {
            ending = false;
            leaveButton.disabled = false;

            if (!terminal) {
                leaveButton.textContent = 'End Call';
            }
        }
    }

    micButton.addEventListener('click', async () => {
        if (!audioTrack || !joined) return;

        muted = !muted;
        await audioTrack.setEnabled(!muted);

        micButton.textContent = muted ? 'Unmute Mic' : 'Mute Mic';
        micButton.classList.toggle('muted', muted);
    });

    cameraButton.addEventListener('click', async () => {
        if (!videoTrack || !joined) return;

        cameraDisabled = !cameraDisabled;
        await videoTrack.setEnabled(!cameraDisabled);

        cameraButton.textContent = cameraDisabled ? 'Camera On' : 'Camera Off';
        cameraButton.classList.toggle('muted', cameraDisabled);
    });

    leaveButton.addEventListener('click', () => {
        void endCall();
    });

    async function initialize() {
        try {
            if (!UUID_PATTERN.test(invitationId || '')) {
                throw new Error('A valid video-call invitation ID is required.');
            }

            if (!supabaseClient) {
                throw new Error('Staging Supabase client is unavailable.');
            }

            const { data: { user }, error: authError } =
                await supabaseClient.auth.getUser();

            if (authError || !user) {
                window.location.replace('login.html');
                return;
            }

            currentUserId = user.id;

            showMessage('Connecting securely to your video-call invitation...');

            invitationChannel = supabaseClient
                .channel(`video-call-invitation-${invitationId}`)
                .on(
                    'postgres_changes',
                    {
                        event: 'UPDATE',
                        schema: 'public',
                        table: 'video_call_invitations',
                        filter: `id=eq.${invitationId}`
                    },
                    payload => {
                        void processInvitation(payload.new);
                    }
                )
                .subscribe(async status => {
                    if (status === 'SUBSCRIBED') {
                        try {
                            await refreshInvitation();
                        } catch (error) {
                            console.error('Invitation loading failed:', error);
                            showMessage(
                                error.message || 'Unable to load call invitation.',
                                true
                            );
                        }
                    }

                    if (
                        status === 'CHANNEL_ERROR' ||
                        status === 'TIMED_OUT'
                    ) {
                        console.error('Invitation subscription problem:', status);
                    }
                });

        } catch (error) {
            console.error('Video-call initialization failed:', error);
            showMessage(error.message || 'Unable to initialize video call.', true);
        }
    }

    window.addEventListener('pagehide', () => {
        if (expiryTimer) clearTimeout(expiryTimer);

        if (invitationChannel && supabaseClient) {
            void supabaseClient.removeChannel(invitationChannel);
        }

        if (audioTrack) audioTrack.close();
        if (videoTrack) videoTrack.close();

        if (rtcClient && joined) {
            void rtcClient.leave();
        }
    });

    setControlsEnabled(false);
    void initialize();
})();
</script>
  <script src="js/notifications.js"></script>
</body>
</html>
