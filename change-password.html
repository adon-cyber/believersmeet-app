<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password | BelieversMeet</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    
</head>
<body>

    <div class="card" style="max-width: 400px; margin: 50px auto;">
        <h2>Change Password</h2>
        
        <input type="password" id="new-password" placeholder="New Password" style="width: 100%; margin-bottom: 10px;">
        <input type="password" id="confirm-password" placeholder="Confirm New Password" style="width: 100%; margin-bottom: 10px;">
        
        <label style="display: block; margin-bottom: 15px; font-size: 0.9rem;">
            <input type="checkbox" onclick="toggleVisibility()"> Show Passwords
        </label>
        
        <button onclick="changePassword()" style="width: 100%;">Update Password</button>
        
        <div style="margin-top: 15px; text-align: center;">
            <a href="feed.html">Back to Dashboard</a>
        </div>
    </div>

    <script>
        // Toggles both password fields
        function toggleVisibility() {
            const pass1 = document.getElementById('new-password');
            const pass2 = document.getElementById('confirm-password');
            const type = pass1.type === 'password' ? 'text' : 'password';
            
            pass1.type = type;
            pass2.type = type;
        }

        async function changePassword() {
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (newPassword.length < 6) {
                alert("Password must be at least 6 characters long.");
                return;
            }

            if (newPassword !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            try {
                const { data, error } = await window.sbClient.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                alert("Password changed successfully!");
                window.location.href = 'feed.html';
            } catch (err) {
                console.error("Password update error:", err);
                alert("Error: " + (err.message || "Failed to update password. Please try again."));
            }
        }
    </script>
</body>
</html>
