<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | BelieversMeet</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
</head>
<body class="bg-[url('images/roo-background.jpg.png')] bg-cover bg-center bg-no-repeat bg-fixed min-h-screen flex flex-col justify-between font-sans antialiased text-gray-900 relative">

    <!-- Header / Navbar -->
    <header class="bg-white/90 backdrop-blur-md border-b border-white/20 relative z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="feed.html" class="text-xl font-bold text-indigo-600 hover:text-indigo-500">BelieversMeet</a>
            <div class="text-sm">
                <a href="feed.html" class="font-medium text-indigo-600 hover:text-indigo-500">&larr; Back to Dashboard</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative z-10">
        <div class="max-w-md w-full space-y-8 backdrop-blur-md bg-white/90 dark:bg-slate-900/90 p-8 shadow-2xl rounded-2xl border border-white/20">
            <div>
                <h2 class="text-center text-3xl font-extrabold text-gray-900 dark:text-white">Change Password</h2>
                <p class="mt-2 text-center text-sm text-gray-600 dark:text-gray-300">
                    Secure your account with a new password.
                </p>
            </div>

            <div id="error-message" class="hidden rounded-md bg-red-50 p-4 text-sm text-red-700 border border-red-200"></div>
            <div id="success-message" class="hidden rounded-md bg-green-50 p-4 text-sm text-green-700 border border-green-200"></div>

            <form id="change-pass-form" class="mt-8 space-y-5">
                <div>
                    <label for="new-password" class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">New Password</label>
                    <div class="relative w-full">
                        <input type="password" id="new-password" required class="appearance-none rounded-lg relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm pr-10 bg-white/80 dark:bg-slate-800 dark:text-white dark:border-slate-700" placeholder="••••••••">
                        <button type="button" onclick="togglePasswordVisibility('new-password', this)" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 focus:outline-none">
                            <svg class="w-5 h-5 eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div>
                    <label for="confirm-password" class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Confirm New Password</label>
                    <div class="relative w-full">
                        <input type="password" id="confirm-password" required class="appearance-none rounded-lg relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm pr-10 bg-white/80 dark:bg-slate-800 dark:text-white dark:border-slate-700" placeholder="••••••••">
                        <button type="button" onclick="togglePasswordVisibility('confirm-password', this)" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 focus:outline-none">
                            <svg class="w-5 h-5 eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div>
                    <button type="submit" class="group relative w-full flex justify-center py-2.5 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors shadow-lg">
                        Update Password
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white/90 backdrop-blur-md border-t border-white/25 mt-auto py-6 relative z-10">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-gray-600 dark:text-gray-300">
        &copy; 2026 BelieversMeet. All rights reserved. Building and strengthening faith communities together.
      </div>
    </footer>

    <!-- Script Section -->
    <script>
        async function waitForSupabase() {
            while (!window.sbClient && !window.supabase) await new Promise(r => setTimeout(r, 100));
            return window.sbClient || window.supabase;
        }

        function togglePasswordVisibility(inputId, btnElement) {
            const input = document.getElementById(inputId);
            if (!input) return;
            
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';

            const svg = btnElement.querySelector('svg');
            if (svg) {
                if (isPassword) {
                    svg.innerHTML = `
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                    `;
                } else {
                    svg.innerHTML = `
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    `;
                }
            }
        }

        document.getElementById('change-pass-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errBox = document.getElementById('error-message');
            const succBox = document.getElementById('success-message');
            errBox.classList.add('hidden');
            succBox.classList.add('hidden');

            const sb = await waitForSupabase();
            const btn = document.querySelector('button[type="submit"]');

            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (newPassword.length < 6) {
                errBox.textContent = "Password must be at least 6 characters long.";
                errBox.classList.remove('hidden');
                return;
            }

            if (newPassword !== confirmPassword) {
                errBox.textContent = "Passwords do not match!";
                errBox.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.textContent = "Updating...";

            try {
                const { data, error } = await sb.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                succBox.textContent = "Password changed successfully! Redirecting...";
                succBox.classList.remove('hidden');
                setTimeout(() => {
                    window.location.href = 'feed.html';
                }, 1500);
            } catch (err) {
                console.error("Password update error:", err);
                errBox.textContent = "Error: " + (err.message || "Failed to update password. Please try again.");
                errBox.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = "Update Password";
            }
        });
    </script>
</body>
</html>
