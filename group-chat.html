<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Chat | BelieversMeet</title>
    <link rel="icon" href="images/BELIEVERS.LOGO.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hidden { display: none !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/believersmeet-brand.css?v=20261127-v2">
<link rel="stylesheet" href="css/workspace-nav.css?v=20261128-v2">
<script src="js/church-branding.js?v=20261128-v2"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <!-- Navigation Header -->
    <div id="navbar"></div>
<script src="js/workspace-nav.js?v=20261128-v2"></script>

    <!-- Main Group Chat Container -->
    <main class="flex-grow w-full max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col py-6 space-y-4">
        <!-- Chat Header Card -->
        <div id="chat-header" class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <a href="groups.html" class="text-blue-600 hover:text-blue-800 text-sm font-semibold flex items-center gap-1.5 bg-blue-50 px-3 py-2 rounded-xl transition">
                    <i class="fas fa-arrow-left"></i> Groups
                </a>
                <div class="flex items-center space-x-3">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-700 text-white flex items-center justify-center font-bold text-base shadow-md">
                        <i class="fas fa-users"></i>
                    </div>
                    <div>
                        <h2 id="group-name" class="font-extrabold text-gray-900 text-lg tracking-tight">Loading Group...</h2>
                        <p class="text-xs font-medium text-gray-500">Group Fellowship Chat</p>
                    </div>
                </div>
            </div>
            <div>
                <button id="start-video-call" type="button" class="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow transition transform hover:-translate-y-0.5 text-sm flex items-center gap-2">
                    <i class="fas fa-video"></i> <span class="hidden sm:inline">Start Group Call</span>
                </button>
            </div>
        </div>
        <div id="group-call-banner" class="hidden bg-blue-50 border border-blue-200 rounded-xl p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
            <div>
                <p class="font-bold text-blue-900"><i class="fas fa-video mr-2"></i>A group video call is active</p>
                <p id="group-call-banner-text" class="text-sm text-blue-700 mt-1">Join your group members in the live room.</p>
            </div>
            <button id="join-group-call" type="button" class="px-4 py-2 rounded-lg bg-blue-700 hover:bg-blue-800 text-white font-semibold text-sm">Join Call</button>
        </div>

        <!-- Message History Container Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col flex-grow overflow-hidden" style="height: 500px;">
            <div id="messages-container" class="flex-grow p-5 overflow-y-auto flex flex-col space-y-4">
                <div class="text-center text-gray-400 py-8">Loading group messages...</div>
            </div>

            <!-- Message Input Area -->
            <div class="p-4 border-t border-gray-200 bg-gray-50/50">
                <form id="message-form" class="w-full flex gap-3 items-center" onsubmit="sendGroupMessage(event)">
                    <input
                        type="text"
                        id="message-input"
                        placeholder="Type a message to the group..."
                        required
                        autocomplete="off"
                        class="flex-grow min-w-0 bg-white border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm text-gray-800 shadow-sm"
                    >
                    <button
                        type="submit"
                        id="send-btn"
                        class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow transition transform hover:-translate-y-0.5 text-sm shrink-0 flex items-center gap-2"
                    >
                        <span>Send</span> <i class="fas fa-paper-plane text-xs"></i>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script>
        let currentUser = null;
        const urlParams = new URLSearchParams(window.location.search);
        const groupId = urlParams.get('groupId') || urlParams.get('group');
        let groupData = null;
        let currentProfile = null;
        let activeGroupCall = null;
        let groupCallPollTimer = null;
        let canJoinGroupCall = false;

        async function loadChurchLogo(churchId) {
            const img = document.getElementById('church-logo-img');
            const placeholder = document.getElementById('church-logo-placeholder');
            if (!img) return;
            img.src = 'images/BELIEVERS.LOGO.png';
            img.classList.remove('hidden');
            if (placeholder) placeholder.classList.add('hidden');
            if (!churchId || !window.sbClient) return;
            try {
                const { data: church, error } = await window.sbClient
                    .from('churches').select('logo_url, name').eq('id', churchId).maybeSingle();
                if (error) throw error;
                if (church?.logo_url) {
                    const url = new URL(church.logo_url, window.location.href);
                    if (['https:', 'http:'].includes(url.protocol)) {
                        img.src = url.href;
                        img.alt = `${church.name || 'Church'} logo`;
                    }
                }
            } catch (error) {
                console.warn('Church logo unavailable; using BelieversMeet fallback.', error);
            }
        }

        async function initGroupChat() {
            if (!groupId) {
                document.getElementById('messages-container').innerHTML = `<div class="text-center text-red-500 py-8">Group ID not specified in URL.</div>`;
                return;
            }

            const { data: { user } } = await window.sbClient.auth.getUser();
            currentUser = user;

            if (!currentUser) {
                window.location.replace('login.html');
                return;
            }

            // Check admin status for navigation
            try {
                const { data: profile, error: profileError } = await window.sbClient.from('profiles').select('role, church_id, status, is_blocked').eq('id', currentUser.id).maybeSingle();
                if (profileError) throw profileError;
                currentProfile = profile;
                const { data: platformAdmin, error: platformAdminError } =
                    await window.sbClient.rpc('is_super_admin');
                if (platformAdminError) console.warn('Platform admin check failed:', platformAdminError);
                const profileRole = String(profile?.role || '').trim().toLowerCase();
                const accountActive = profile?.status === 'active' && profile?.is_blocked !== true;
                const canOpenAdmin = platformAdmin === true || (accountActive &&
                    ['admin', 'church_admin', 'finance', 'super_admin', 'super-admin'].includes(profileRole));
                if (canOpenAdmin) {
                    const adminLink = document.getElementById('admin-nav-link');
                    const adminLinkMobile = document.getElementById('admin-nav-link-mobile');
                    if (adminLink) adminLink.classList.remove('hidden');
                    if (adminLinkMobile) adminLinkMobile.classList.remove('hidden');
                }
            } catch (err) {
                console.warn("Could not check admin status:", err);
            }

            // Fetch group details
            const { data: group, error: groupErr } = await window.sbClient.from('groups').select('*').eq('id', groupId).maybeSingle();
            if (groupErr || !group) {
                document.getElementById('group-name').textContent = 'Unknown Group';
                document.getElementById('messages-container').innerHTML = `<div class="text-center text-red-500 py-8">Group could not be found.</div>`;
                return;
            }

            groupData = group;
            await loadChurchLogo(currentProfile?.church_id === groupData.church_id ? groupData.church_id : null);

            const { data: groupRoster, error: rosterAccessError } =
                await window.sbClient.rpc('get_group_member_roster', {
                    p_group_id: groupId
                });

            if (rosterAccessError || !Array.isArray(groupRoster)) {
                document.getElementById('group-name').textContent = groupData.name || 'Group Chat';
                document.getElementById('messages-container').innerHTML =
                    '<div class="text-center text-amber-600 py-8">You need approved membership or group-management permission to access this chat.</div>';
                return;
            }

                        document.getElementById('group-name').textContent = groupData.name || 'Cell Group';

            const { data: canCall, error: membershipError } = await window.sbClient.rpc(
                'is_approved_group_member', { p_group_id: groupId }
            );
            canJoinGroupCall = !membershipError && canCall === true;
            if (!canJoinGroupCall) {
                const callButton = document.getElementById('start-video-call');
                if (callButton) {
                    callButton.disabled = true;
                    callButton.classList.add('opacity-50', 'cursor-not-allowed');
                    callButton.title = 'Only approved group members can start or join group calls.';
                }
            }

            await fetchGroupMessages();
            setupGroupRealtimeSubscription();
            await loadActiveGroupCall();
            groupCallPollTimer = window.setInterval(() => void loadActiveGroupCall(), 15000);
        }

        async function fetchGroupMessages() {
            const container = document.getElementById('messages-container');

            try {
                const { data: messages, error } = await window.sbClient
                    .from('messages')
                    .select('*')
                    .eq('group_id', groupId)
                    .order('created_at', { ascending: true });

                if (error) throw error;

                const { data: roster, error: rosterError } =
                    await window.sbClient.rpc('get_group_member_roster', {
                        p_group_id: groupId
                    });

                if (rosterError) throw rosterError;

                const profileMap = new Map(
                    (roster || []).map(member => [
                        member.user_id,
                        {
                            full_name: member.full_name || member.display_name || 'Group Member',
                            avatar_url: member.avatar_url || null
                        }
                    ])
                );

                const messagesWithSenders = (messages || []).map(message => ({
                    ...message,
                    profiles: profileMap.get(message.sender_id) || {
                        full_name: 'Group Member',
                        avatar_url: null
                    }
                }));

                renderGroupMessages(messagesWithSenders);
            } catch (error) {
                console.error('Error fetching group messages:', error);
                container.innerHTML =
                    `<div class="text-center text-red-500 py-4">Error loading messages: ${escapeHTML(error.message)}</div>`;
            }
        }
        function formatMessageDate(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            return date.toLocaleDateString(undefined, {
                month: 'short',
                day: 'numeric'
            }) + ' at ' + date.toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function renderGroupMessages(messages) {
            const container = document.getElementById('messages-container');
            if (messages.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-400 py-8">No messages in this group yet. Be the first to greet!</div>`;
                return;
            }

            container.innerHTML = messages.map(msg => {
                const isMe = msg.sender_id === currentUser.id;
                const sender = msg.profiles || {};
                const senderName = sender.full_name || 'Group Member';
                const avatarUrl = sender.avatar_url || 'assets/default-avatar.png';
                const timeStr = formatMessageDate(msg.created_at);

                if (isMe) {
                    return `
                        <div class="flex flex-col items-end w-full">
                            <div class="flex items-end justify-end space-x-2 max-w-[85%] sm:max-w-md">
                                <div class="flex flex-col items-end">
                                    <div class="flex items-center space-x-2 mb-1">
                                        <span class="text-[11px] text-gray-400">${timeStr}</span>
                                        <span class="text-xs font-bold text-gray-700">${escapeHTML(senderName)}</span>
                                    </div>
                                    <div class="px-4 py-2.5 rounded-2xl text-sm break-words bg-blue-600 text-white rounded-br-none shadow-sm">
                                        ${escapeHTML(msg.content)}
                                    </div>
                                </div>
                                <img src="${escapeHTML(avatarUrl)}" class="w-8 h-8 rounded-full flex-shrink-0 object-cover shadow-sm" alt="${escapeHTML(senderName)}" onerror="this.src='images/BELIEVERS.LOGO.png'">
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="flex flex-col items-start w-full">
                            <div class="flex items-end justify-start space-x-2 max-w-[85%] sm:max-w-md">
                                <img src="${escapeHTML(avatarUrl)}" class="w-8 h-8 rounded-full flex-shrink-0 object-cover shadow-sm" alt="${escapeHTML(senderName)}" onerror="this.src='images/BELIEVERS.LOGO.png'">
                                <div class="flex flex-col items-start">
                                    <div class="flex items-center space-x-2 mb-1">
                                        <span class="text-xs font-bold text-gray-900">${escapeHTML(senderName)}</span>
                                        <span class="text-[11px] text-gray-400">${timeStr}</span>
                                    </div>
                                    <div class="px-4 py-2.5 rounded-2xl text-sm break-words bg-white text-gray-900 border border-gray-200 rounded-bl-none shadow-sm">
                                        ${escapeHTML(msg.content)}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }).join('');

            container.scrollTop = container.scrollHeight;
        }

        async function sendGroupMessage(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const content = input.value.trim();
            if (!content || !currentUser || !groupId) return;

            input.value = '';

            try {
                const { error } = await window.sbClient
                    .from('messages')
                    .insert([{
                        sender_id: currentUser.id,
                        group_id: groupId,
                        content: content
                    }]);

                if (error) {
                    alert("Failed to send message: " + error.message);
                } else {
                    await fetchGroupMessages();
                }
            } catch (e) {
                console.error("Error sending group message:", e);
            }
        }

        function setupGroupRealtimeSubscription() {
            window.sbClient
                .channel(`group-${groupId}`)
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `group_id=eq.${groupId}` }, payload => { appendMessageToUI(payload.new); })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'group_video_call_sessions', filter: `group_id=eq.${groupId}` }, () => { void loadActiveGroupCall(); })
                .subscribe();
        }

        async function appendMessageToUI(msg) {
            // If message belongs to current group, fetch messages or append
            if (msg.group_id === groupId) {
                await fetchGroupMessages();
            }
        }

        async function loadActiveGroupCall() {
            if (!window.sbClient || !groupId) return;
            try {
                const { data, error } = await window.sbClient
                    .from('group_video_call_sessions')
                    .select('id, created_by, expires_at, status')
                    .eq('group_id', groupId)
                    .eq('status', 'active')
                    .gt('expires_at', new Date().toISOString())
                    .order('created_at', { ascending: false })
                    .limit(1)
                    .maybeSingle();
                if (error) throw error;
                activeGroupCall = data || null;
                const banner = document.getElementById('group-call-banner');
                const joinButton = document.getElementById('join-group-call');
                const text = document.getElementById('group-call-banner-text');
                if (!banner || !joinButton || !text) return;
                if (!activeGroupCall) {
                    banner.classList.add('hidden');
                    return;
                }
                text.textContent = activeGroupCall.created_by === currentUser?.id
                    ? 'Your group call is active. Rejoin the room if needed.'
                    : 'A group member has started a call. Join while the session is active.';
                joinButton.disabled = !canJoinGroupCall;
                joinButton.textContent = canJoinGroupCall ? 'Join Call' : 'Approved members only';
                joinButton.title = canJoinGroupCall
                    ? 'Join the active group video call'
                    : 'Only approved members of this group can join the video call.';
                banner.classList.remove('hidden');
                joinButton.onclick = () => {
                    if (!canJoinGroupCall) return;
                    window.location.href = `group-video-call.html?session=${encodeURIComponent(activeGroupCall.id)}`;
                };
            } catch (error) {
                // Read access is limited by RLS to approved group members and authorized managers.
                console.warn('Active group call could not be checked:', error);
            }
        }

        async function startGroupVideoCall() {
            const button = document.getElementById('start-video-call');
            if (!button || button.disabled || !currentUser || !groupId) return;
            const previous = button.innerHTML;
            button.disabled = true;
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Starting...';
            try {
                const { data: isMember, error: membershipError } = await window.sbClient.rpc(
                    'is_approved_group_member', { p_group_id: groupId }
                );
                if (membershipError) throw membershipError;
                if (isMember !== true) {
                    throw new Error('Only approved members of this group can start a group video call.');
                }
                const { data: sessionId, error } = await window.sbClient.rpc(
                    'create_group_video_call', { p_group_id: groupId }
                );
                if (error) throw error;
                if (typeof sessionId !== 'string') throw new Error('The group call service returned an invalid session.');
                window.location.href = `group-video-call.html?session=${encodeURIComponent(sessionId)}`;
            } catch (error) {
                console.error('Unable to start group video call:', error);
                alert(error.message || 'Unable to start the group video call.');
                button.disabled = false;
                button.innerHTML = previous;
            }
        }

        document.getElementById('start-video-call')?.addEventListener('click', startGroupVideoCall);
        window.addEventListener('beforeunload', () => {
            if (groupCallPollTimer) window.clearInterval(groupCallPollTimer);
        });

        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, function(s) {
                return {
                    '&': '&',
                    '<': '<',
                    '>': '>',
                    '"': '"',
                    "'": '&#039;'
                }[s];
            });
        }

        async function logoutUser(e) {
            e.preventDefault();
            await window.sbClient.auth.signOut();
            window.location.replace('login.html');
        }

        (async () => {
            let retries = 0;
            while (!window.sbClient && retries < 20) {
                await new Promise(r => setTimeout(r, 200));
                retries++;
            }

            if (!window.sbClient) return;

            await initGroupChat();
        })();
    </script>
    <script src="js/notifications.js"></script>
</body>
</html>
