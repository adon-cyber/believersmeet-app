<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Chat | BelieversMeet</title>
    <link rel="icon" href="images/BELIEVERS.LOGO.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hidden { display: none !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <!-- Navigation Header -->
    <header class="bg-gradient-to-r from-blue-900 to-indigo-900 shadow-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 shrink-0">
                <a href="feed.html" class="flex items-center space-x-2">
                    <div id="church-logo-container" class="flex items-center space-x-2">
                        <img id="church-logo-img" src="" alt="Logo" class="w-10 h-10 rounded-full object-cover border-2 border-white/20 shadow hidden">
                        <span id="church-logo-placeholder" class="w-10 h-10 rounded-full bg-blue-700 text-white flex items-center justify-center font-bold text-sm border border-white/20 shadow">BM</span>
                    </div>
                    <span class="text-white font-bold text-lg tracking-tight">BelieversMeet</span>
                </a>
            </div>
            <!-- Desktop Navigation Links -->
            <nav class="hidden md:flex items-center space-x-6">
                <a href="feed.html" class="text-sm font-medium text-white/80 hover:text-white transition whitespace-nowrap">Feed</a>
                <a href="events.html" class="text-sm font-medium text-white/80 hover:text-white transition whitespace-nowrap">Events</a>
                <a href="sermons.html" class="text-sm font-medium text-white/80 hover:text-white transition whitespace-nowrap">Sermons & Media</a>
                <a href="giving.html" class="text-sm font-medium text-white/80 hover:text-white transition whitespace-nowrap">Giving</a>
                <a href="groups.html" class="text-sm font-medium text-white bg-blue-700/80 px-3 py-1.5 rounded-lg shadow transition whitespace-nowrap">Groups</a>
                <a href="admin.html" id="admin-nav-link" class="text-sm font-medium text-amber-300 hover:text-amber-200 transition hidden whitespace-nowrap">Admin Console</a>
            </nav>
            <!-- Mobile Navigation Container (Horizontal Scrollable) -->
            <div class="flex md:hidden overflow-x-auto whitespace-nowrap scrollbar-none items-center space-x-3 py-2 px-2 flex-grow mx-3 [-webkit-overflow-scrolling:touch] no-scrollbar">
                <a href="feed.html" class="text-xs font-medium text-white/80 hover:text-white transition whitespace-nowrap shrink-0">Feed</a>
                <a href="events.html" class="text-xs font-medium text-white/80 hover:text-white transition whitespace-nowrap shrink-0">Events</a>
                <a href="sermons.html" class="text-xs font-medium text-white/80 hover:text-white transition whitespace-nowrap shrink-0">Sermons & Media</a>
                <a href="giving.html" class="text-xs font-medium text-white/80 hover:text-white transition whitespace-nowrap shrink-0">Giving</a>
                <a href="groups.html" class="text-xs font-medium text-white bg-blue-700/80 px-2.5 py-1 rounded-md shadow transition whitespace-nowrap shrink-0">Groups</a>
                <a href="admin.html" id="admin-nav-link-mobile" class="text-xs font-medium text-amber-300 hover:text-amber-200 transition hidden whitespace-nowrap shrink-0">Admin Console</a>
            </div>
            <div class="flex items-center space-x-3 shrink-0">
                <a href="profile.html" class="w-9 h-9 rounded-full bg-blue-700/50 text-white flex items-center justify-center font-bold text-sm border border-white/20 shadow">
                    <i class="fas fa-user"></i>
                </a>
                <button onclick="logoutUser(event)" class="text-white/80 hover:text-white p-2 rounded-lg transition" title="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Group Chat Container -->
    <main class="flex-grow w-full max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col py-6 space-y-4">
        <!-- Chat Header Card -->
        <div id="chat-header" class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <a href="groups.html" class="text-blue-600 hover:text-blue-800 text-sm font-semibold flex items-center gap-1.5 bg-blue-50 px-3 py-2 rounded-xl transition">
                    <i class="fas fa-arrow-left"></i> Groups
                </a>
                <div class="flex items-center space-x-3">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-700 text-white flex items-center justify-center font-bold text-base shadow-md">
                        <i class="fas fa-users"></i>
                    </div>
                    <div>
                        <h2 id="group-name" class="font-extrabold text-gray-900 text-lg tracking-tight">Loading Group...</h2>
                        <p class="text-xs font-medium text-gray-500">Group Fellowship Chat</p>
                    </div>
                </div>
            </div>
            <div>
                <button id="start-video-call" class="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow transition transform hover:-translate-y-0.5 text-sm flex items-center gap-2">
                    <i class="fas fa-video"></i> <span class="hidden sm:inline">Video Call</span>
                </button>
            </div>
        </div>

        <!-- Group Video Call Overlay UI (Multi-peer room link or multi-grid) -->
        <div id="video-call-overlay" class="hidden fixed inset-0 z-50 bg-black flex flex-col justify-between p-4">
            <div class="flex justify-between items-center text-white p-2">
                <h3 id="video-room-title" class="font-bold text-lg">Group Video Room</h3>
                <button onclick="terminateGroupCall()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-bold">Leave Room</button>
            </div>
            <div class="flex-grow grid grid-cols-1 md:grid-cols-2 gap-4 p-4 overflow-y-auto items-center justify-center">
                <div class="relative bg-gray-900 rounded-xl overflow-hidden aspect-video border border-gray-700 flex items-center justify-center">
                    <video id="local-video" autoplay muted playsinline class="w-full h-full object-cover"></video>
                    <span class="absolute bottom-3 left-3 bg-black/60 text-white text-xs px-2 py-1 rounded">You</span>
                </div>
                <!-- Multi-peer video placeholder container -->
                <div class="relative bg-gray-900 rounded-xl overflow-hidden aspect-video border border-gray-700 flex items-center justify-center">
                    <div id="remote-video-placeholder" class="text-gray-400 text-sm flex flex-col items-center">
                        <i class="fas fa-users text-3xl mb-2"></i>
                        <span>Waiting for group members to join room...</span>
                    </div>
                    <video id="remote-video" autoplay playsinline class="w-full h-full object-cover hidden"></video>
                </div>
            </div>
            <div class="bg-gray-900/80 p-4 rounded-xl flex items-center justify-center space-x-4">
                <button id="toggle-mic" class="bg-gray-700 hover:bg-gray-600 text-white w-12 h-12 rounded-full flex items-center justify-center transition-colors">
                    <i class="fas fa-microphone text-lg"></i>
                </button>
                <button id="toggle-camera" class="bg-gray-700 hover:bg-gray-600 text-white w-12 h-12 rounded-full flex items-center justify-center transition-colors">
                    <i class="fas fa-video text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Message History Container Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col flex-grow overflow-hidden" style="height: 500px;">
            <div id="messages-container" class="flex-grow p-5 overflow-y-auto flex flex-col space-y-4">
                <div class="text-center text-gray-400 py-8">Loading group messages...</div>
            </div>

            <!-- Message Input Area -->
            <div class="p-4 border-t border-gray-200 bg-gray-50/50">
                <form id="message-form" class="w-full flex gap-3 items-center" onsubmit="sendGroupMessage(event)">
                    <input
                        type="text"
                        id="message-input"
                        placeholder="Type a message to the group..."
                        required
                        autocomplete="off"
                        class="flex-grow min-w-0 bg-white border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm text-gray-800 shadow-sm"
                    >
                    <button
                        type="submit"
                        id="send-btn"
                        class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow transition transform hover:-translate-y-0.5 text-sm shrink-0 flex items-center gap-2"
                    >
                        <span>Send</span> <i class="fas fa-paper-plane text-xs"></i>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script>
        let currentUser = null;
        const urlParams = new URLSearchParams(window.location.search);
        const groupId = urlParams.get('groupId') || urlParams.get('group');
        let groupData = null;
        let localStream = null;

        async function loadChurchLogo() {
            try {
                const churchId = localStorage.getItem('church_id');
                if (!churchId) return;
                const { data: church } = await window.sbClient.from('churches').select('logo_url').eq('id', churchId).maybeSingle();
                if (church && church.logo_url) {
                    const img = document.getElementById('church-logo-img');
                    const placeholder = document.getElementById('church-logo-placeholder');
                    img.src = church.logo_url;
                    img.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                }
            } catch (e) {
                console.error("Error loading church logo:", e);
            }
        }

        async function initGroupChat() {
            if (!groupId) {
                document.getElementById('messages-container').innerHTML = `<div class="text-center text-red-500 py-8">Group ID not specified in URL.</div>`;
                return;
            }

            const { data: { user } } = await window.sbClient.auth.getUser();
            currentUser = user;

            if (!currentUser) {
                window.location.replace('login.html');
                return;
            }

            // Check admin status for navigation
            try {
                const { data: profile } = await window.sbClient.from('profiles').select('role, church_id').eq('id', currentUser.id).maybeSingle();
                if (profile) {
                    if (profile.church_id && !localStorage.getItem('church_id')) {
                        localStorage.setItem('church_id', profile.church_id);
                    }
                    if (profile.role === 'admin' || profile.role === 'super_admin' || profile.role === 'church_admin') {
                        const adminLink = document.getElementById('admin-nav-link');
                        const adminLinkMobile = document.getElementById('admin-nav-link-mobile');
                        if (adminLink) adminLink.classList.remove('hidden');
                        if (adminLinkMobile) adminLinkMobile.classList.remove('hidden');
                    }
                }
            } catch (err) {
                console.warn("Could not check admin status:", err);
            }

            // Fetch group details
            const { data: group, error: groupErr } = await window.sbClient.from('groups').select('*').eq('id', groupId).maybeSingle();
            if (groupErr || !group) {
                document.getElementById('group-name').textContent = 'Unknown Group';
                document.getElementById('messages-container').innerHTML = `<div class="text-center text-red-500 py-8">Group could not be found.</div>`;
                return;
            }

            groupData = group;

            const { data: groupRoster, error: rosterAccessError } =
                await window.sbClient.rpc('get_group_member_roster', {
                    p_group_id: groupId
                });

            if (rosterAccessError || !Array.isArray(groupRoster)) {
                document.getElementById('group-name').textContent = groupData.name || 'Group Chat';
                document.getElementById('messages-container').innerHTML =
                    '<div class="text-center text-amber-600 py-8">You need approved membership or group-management permission to access this chat.</div>';
                return;
            }

                        document.getElementById('group-name').textContent = groupData.name || 'Cell Group';
            document.getElementById('video-room-title').textContent = `${groupData.name} - Video Room`;

            await fetchGroupMessages();
            setupGroupRealtimeSubscription();
        }

        async function fetchGroupMessages() {
            const container = document.getElementById('messages-container');

            try {
                const { data: messages, error } = await window.sbClient
                    .from('messages')
                    .select('*')
                    .eq('group_id', groupId)
                    .order('created_at', { ascending: true });

                if (error) throw error;

                const { data: roster, error: rosterError } =
                    await window.sbClient.rpc('get_group_member_roster', {
                        p_group_id: groupId
                    });

                if (rosterError) throw rosterError;

                const profileMap = new Map(
                    (roster || []).map(member => [
                        member.user_id,
                        {
                            full_name: member.full_name || member.display_name || 'Group Member',
                            avatar_url: member.avatar_url || null
                        }
                    ])
                );

                const messagesWithSenders = (messages || []).map(message => ({
                    ...message,
                    profiles: profileMap.get(message.sender_id) || {
                        full_name: 'Group Member',
                        avatar_url: null
                    }
                }));

                renderGroupMessages(messagesWithSenders);
            } catch (error) {
                console.error('Error fetching group messages:', error);
                container.innerHTML =
                    `<div class="text-center text-red-500 py-4">Error loading messages: ${escapeHTML(error.message)}</div>`;
            }
        }
        function formatMessageDate(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            return date.toLocaleDateString(undefined, {
                month: 'short',
                day: 'numeric'
            }) + ' at ' + date.toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function renderGroupMessages(messages) {
            const container = document.getElementById('messages-container');
            if (messages.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-400 py-8">No messages in this group yet. Be the first to greet!</div>`;
                return;
            }

            container.innerHTML = messages.map(msg => {
                const isMe = msg.sender_id === currentUser.id;
                const sender = msg.profiles || {};
                const senderName = sender.full_name || 'Group Member';
                const avatarUrl = sender.avatar_url || 'assets/default-avatar.png';
                const timeStr = formatMessageDate(msg.created_at);

                if (isMe) {
                    return `
                        <div class="flex flex-col items-end w-full">
                            <div class="flex items-end justify-end space-x-2 max-w-[85%] sm:max-w-md">
                                <div class="flex flex-col items-end">
                                    <div class="flex items-center space-x-2 mb-1">
                                        <span class="text-[11px] text-gray-400">${timeStr}</span>
                                        <span class="text-xs font-bold text-gray-700">${escapeHTML(senderName)}</span>
                                    </div>
                                    <div class="px-4 py-2.5 rounded-2xl text-sm break-words bg-blue-600 text-white rounded-br-none shadow-sm">
                                        ${escapeHTML(msg.content)}
                                    </div>
                                </div>
                                <img src="${escapeHTML(avatarUrl)}" class="w-8 h-8 rounded-full flex-shrink-0 object-cover shadow-sm" alt="${escapeHTML(senderName)}" onerror="this.src='images/BELIEVERS.LOGO.png'">
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="flex flex-col items-start w-full">
                            <div class="flex items-end justify-start space-x-2 max-w-[85%] sm:max-w-md">
                                <img src="${escapeHTML(avatarUrl)}" class="w-8 h-8 rounded-full flex-shrink-0 object-cover shadow-sm" alt="${escapeHTML(senderName)}" onerror="this.src='images/BELIEVERS.LOGO.png'">
                                <div class="flex flex-col items-start">
                                    <div class="flex items-center space-x-2 mb-1">
                                        <span class="text-xs font-bold text-gray-900">${escapeHTML(senderName)}</span>
                                        <span class="text-[11px] text-gray-400">${timeStr}</span>
                                    </div>
                                    <div class="px-4 py-2.5 rounded-2xl text-sm break-words bg-white text-gray-900 border border-gray-200 rounded-bl-none shadow-sm">
                                        ${escapeHTML(msg.content)}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }).join('');

            container.scrollTop = container.scrollHeight;
        }

        async function sendGroupMessage(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const content = input.value.trim();
            if (!content || !currentUser || !groupId) return;

            input.value = '';

            try {
                const { error } = await window.sbClient
                    .from('messages')
                    .insert([{
                        sender_id: currentUser.id,
                        group_id: groupId,
                        content: content
                    }]);

                if (error) {
                    alert("Failed to send message: " + error.message);
                } else {
                    await fetchGroupMessages();
                }
            } catch (e) {
                console.error("Error sending group message:", e);
            }
        }

        function setupGroupRealtimeSubscription() {
            window.sbClient
                .channel(`group-${groupId}`)
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `group_id=eq.${groupId}` }, payload => { appendMessageToUI(payload.new); })
                .subscribe();
        }

        async function appendMessageToUI(msg) {
            // If message belongs to current group, fetch messages or append
            if (msg.group_id === groupId) {
                await fetchGroupMessages();
            }
        }

        // Video call trigger for group
        document.getElementById('start-video-call').addEventListener('click', async () => {
            const overlay = document.getElementById('video-call-overlay');
            overlay.classList.remove('hidden');
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video').srcObject = localStream;
            } catch (e) {
                console.error("Camera/Mic access error:", e);
                alert("Could not access camera or microphone.");
            }
        });

        function terminateGroupCall() {
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            document.getElementById('video-call-overlay').classList.add('hidden');
        }

        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, function(s) {
                return {
                    '&': '&',
                    '<': '<',
                    '>': '>',
                    '"': '"',
                    "'": '&#039;'
                }[s];
            });
        }

        async function logoutUser(e) {
            e.preventDefault();
            await window.sbClient.auth.signOut();
            window.location.replace('login.html');
        }

        (async () => {
            let retries = 0;
            while (!window.sbClient && retries < 20) {
                await new Promise(r => setTimeout(r, 200));
                retries++;
            }

            if (!window.sbClient) return;

            await loadChurchLogo();
            await initGroupChat();
        })();
    </script>
    <script src="js/notifications.js"></script>
</body>
</html>
