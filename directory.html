<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Directory | BelieversMeet</title>
    <link rel="icon" href="images/BELIEVERS.LOGO.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <!-- Navigation Header Container -->
    <div id="navbar"></div>
    <script src="js/nav.js"></script>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-16 flex-grow w-full">
        <!-- Header Banner -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-6 sm:p-8 text-white shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight flex items-center gap-2">
                    <i class="fas fa-store"></i> Church Business & Skills Directory
                </h1>
                <p class="text-blue-100 mt-1 text-sm sm:text-base">Support fellow believers by discovering and connecting with businesses and professional services within our church community.</p>
            </div>
            <button onclick="openAddModal()" class="px-5 py-2.5 bg-white text-blue-700 font-bold rounded-xl shadow hover:bg-blue-50 transition transform hover:-translate-y-0.5 text-sm sm:text-base flex items-center gap-2 flex-shrink-0">
                <i class="fas fa-plus"></i> Add My Business
            </button>
        </div>

        <!-- Search & Filter Bar -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 mb-8 flex flex-col sm:flex-row gap-4">
            <div class="flex-grow relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-gray-400">
                    <i class="fas fa-search"></i>
                </span>
                <input type="text" id="searchInput" oninput="filterBusinesses()" placeholder="Search businesses, services, or descriptions..." class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm font-medium">
            </div>
            <div class="sm:w-72">
                <select id="categorySelect" onchange="filterBusinesses()" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm bg-white font-medium text-gray-700">
                    <option value="All">All Categories</option>
                    <option value="Technology">Technology</option>
                    <option value="Trades & Construction">Trades & Construction</option>
                    <option value="Food & Events">Food & Events</option>
                    <option value="Professional Services">Professional Services</option>
                    <option value="Health & Wellness">Health & Wellness</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>

        <!-- Business Listings Responsive Grid -->
        <div id="businessGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Loading state -->
            <div class="col-span-full text-center py-16 text-gray-500 bg-white rounded-2xl shadow-sm border border-gray-200">
                <i class="fas fa-spinner fa-spin text-3xl text-blue-600 mb-3"></i>
                <p class="text-sm font-semibold text-gray-700">Loading business directory...</p>
            </div>
        </div>
    </main>

    <!-- Add My Business Modal -->
    <div id="addBusinessModal" class="fixed inset-0 z-50 overflow-y-auto bg-black bg-opacity-50 backdrop-blur-sm flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden transform transition-all border border-gray-100">
            <div class="bg-blue-600 px-6 py-4 flex justify-between items-center text-white">
                <h3 class="text-lg font-bold flex items-center gap-2"><i class="fas fa-store"></i> Add Your Business or Service</h3>
                <button onclick="closeAddModal()" class="text-white hover:text-gray-200 focus:outline-none transition">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <form id="addBusinessForm" onsubmit="submitBusiness(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wider">Business / Service Name *</label>
                    <input type="text" id="bizName" required class="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-600 text-sm font-medium outline-none" placeholder="e.g. Grace Web Solutions">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wider">Category *</label>
                    <select id="bizCategory" required class="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-600 text-sm bg-white font-medium text-gray-700 outline-none">
                        <option value="">Select category...</option>
                        <option value="Technology">Technology</option>
                        <option value="Trades & Construction">Trades & Construction</option>
                        <option value="Food & Events">Food & Events</option>
                        <option value="Professional Services">Professional Services</option>
                        <option value="Health & Wellness">Health & Wellness</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wider">Description</label>
                    <textarea id="bizDescription" rows="3" class="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-600 text-sm font-medium outline-none resize-none" placeholder="Briefly describe what your business offers..."></textarea>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wider">Phone Number</label>
                        <input type="tel" id="bizPhone" class="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-600 text-sm font-medium outline-none" placeholder="+1 (555) 000-0000">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wider">Email Address</label>
                        <input type="email" id="bizEmail" class="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-600 text-sm font-medium outline-none" placeholder="info@example.com">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wider">Website URL</label>
                    <input type="url" id="bizWebsite" class="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-600 text-sm font-medium outline-none" placeholder="https://example.com">
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t border-gray-100">
                    <button type="button" onclick="closeAddModal()" class="px-5 py-2.5 border border-gray-300 rounded-xl text-sm font-semibold text-gray-700 hover:bg-gray-50 transition">Cancel</button>
                    <button type="submit" id="submitBtn" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-bold shadow-md transition">Submit Listing</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Sticky Footer -->
    <footer class="bg-white border-t border-gray-200 mt-auto py-6 text-center text-xs text-gray-500 flex-shrink-0">
        <div class="max-w-7xl mx-auto px-4">
            &copy; 2026 BelieversMeet. All rights reserved. Building community together.
        </div>
    </footer>

    <script src="js/notifications.js"></script>
    <script>
        let allBusinesses = [];
        let currentUser = null;
        let currentProfile = null;

        async function initPage() {
            let attempts = 0;
            while (!window.sbClient && attempts < 15) {
                await new Promise(r => setTimeout(r, 200));
                attempts++;
            }
            if (!window.sbClient) {
                console.error("Supabase client not initialized.");
                document.getElementById('businessGrid').innerHTML = `
                    <div class="col-span-full text-center py-16 bg-white rounded-2xl shadow-sm border border-gray-200">
                        <i class="fas fa-exclamation-triangle text-3xl text-amber-500 mb-3"></i>
                        <h3 class="text-base font-bold text-gray-900">Connection Error</h3>
                        <p class="text-sm text-gray-500 mt-1">Failed to connect to the database client. Please refresh the page.</p>
                    </div>
                `;
                return;
            }

            const { data: { user }, error: authError } = await window.sbClient.auth.getUser();
            if (authError || !user) {
                window.location.replace('login.html');
                return;
            }
            currentUser = user;

            // Fetch profile to get church_id and admin status
            const { data: profile, error: profileError } = await window.sbClient
                .from('profiles')
                .select('church_id, role, full_name')
                .eq('id', user.id)
                .maybeSingle();

            if (profileError || !profile || !profile.church_id) {
                document.getElementById('businessGrid').innerHTML = `
                    <div class="col-span-full text-center py-16 bg-white rounded-2xl shadow-sm border border-gray-200">
                        <i class="fas fa-church text-3xl text-blue-500 mb-3"></i>
                        <h3 class="text-base font-bold text-gray-900">Church Membership Required</h3>
                        <p class="text-sm text-gray-500 mt-1 mb-4">Please join a church to view and add to the business directory.</p>
                        <a href="join-church.html" class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow transition">Join a Church</a>
                    </div>
                `;
                return;
            }

            currentProfile = profile;
            await fetchBusinesses();
        }

        async function fetchBusinesses() {
            const grid = document.getElementById('businessGrid');
            try {
                const { data, error } = await window.sbClient
                    .from('business_directory')
                    .select('*')
                    .eq('church_id', currentProfile.church_id)
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error('Error fetching businesses:', error);
                    grid.innerHTML = `
                        <div class="col-span-full text-center py-16 bg-white rounded-2xl shadow-sm border border-gray-200">
                            <i class="fas fa-exclamation-circle text-3xl text-red-500 mb-3"></i>
                            <h3 class="text-base font-bold text-gray-900">Failed to load business directory</h3>
                            <p class="text-sm text-gray-500 mt-1">An unexpected error occurred while fetching listings. Please try again later.</p>
                        </div>
                    `;
                    return;
                }

                allBusinesses = data || [];
                renderBusinesses(allBusinesses);
            } catch (err) {
                console.error('Technical error loading businesses:', err);
                grid.innerHTML = `
                    <div class="col-span-full text-center py-16 bg-white rounded-2xl shadow-sm border border-gray-200">
                        <i class="fas fa-exclamation-circle text-3xl text-red-500 mb-3"></i>
                        <h3 class="text-base font-bold text-gray-900">Failed to load business directory</h3>
                        <p class="text-sm text-gray-500 mt-1">An unexpected error occurred while fetching listings. Please try again later.</p>
                    </div>
                `;
            }
        }

        function renderBusinesses(businesses) {
            const grid = document.getElementById('businessGrid');
            if (!businesses || businesses.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-16 bg-white rounded-2xl shadow-sm border border-gray-200">
                        <i class="fas fa-store-alt-slash text-4xl text-gray-400 mb-3"></i>
                        <h3 class="text-base font-bold text-gray-900">No businesses found</h3>
                        <p class="text-sm text-gray-500 mt-1 mb-4">Be the first to list your business or service in our church directory!</p>
                        <button onclick="openAddModal()" class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow transition">
                            <i class="fas fa-plus"></i> Add My Business
                        </button>
                    </div>
                `;
                return;
            }

            grid.innerHTML = businesses.map(b => {
                const ownerName = 'Church Member';
                const categoryColor = getCategoryColor(b.category);
                const isOwner = b.user_id === currentUser.id;
                const isPending = b.is_approved === false;

                return `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 hover:shadow-md transition-all flex flex-col overflow-hidden p-6 relative">
                        ${isOwner ? `<button onclick="deleteBusiness('${b.id}')" class="absolute top-5 right-5 text-gray-400 hover:text-red-600 transition" title="Delete Listing"><i class="fas fa-trash-alt text-base"></i></button>` : ''}
                        <div class="mb-3 pr-8">
                            <div class="flex items-center gap-2 mb-2 flex-wrap">
                                <span class="inline-block px-3 py-1 rounded-full text-xs font-bold ${categoryColor}">${escapeHtml(b.category)}</span>
                                ${isPending ? `<span class="inline-block px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-200">Pending Approval</span>` : `<span class="inline-block px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800">Verified & Live</span>`}
                            </div>
                            <h3 class="text-lg font-bold text-gray-900">${escapeHtml(b.business_name)}</h3>
                        </div>
                        <p class="text-sm text-gray-600 flex-grow mb-4 whitespace-pre-line leading-relaxed">${escapeHtml(b.description || 'No description provided.')}</p>
                        
                        <div class="space-y-2.5 pt-4 border-t border-gray-100 text-xs text-gray-600 font-medium">
                            <div class="flex items-center">
                                <i class="fas fa-user-circle text-gray-400 w-5 flex-shrink-0 text-sm"></i>
                                <span>Listed by: <strong class="text-gray-800">${escapeHtml(ownerName)}</strong></span>
                            </div>
                            ${b.phone ? `
                                <div class="flex items-center">
                                    <i class="fas fa-phone text-gray-400 w-5 flex-shrink-0 text-sm"></i>
                                    <a href="tel:${escapeHtml(b.phone)}" class="text-blue-600 hover:underline font-semibold">${escapeHtml(b.phone)}</a>
                                </div>
                            ` : ''}
                            ${b.email ? `
                                <div class="flex items-center">
                                    <i class="fas fa-envelope text-gray-400 w-5 flex-shrink-0 text-sm"></i>
                                    <a href="mailto:${escapeHtml(b.email)}" class="text-blue-600 hover:underline truncate font-semibold">${escapeHtml(b.email)}</a>
                                </div>
                            ` : ''}
                            ${b.website_url ? `
                                <div class="flex items-center">
                                    <i class="fas fa-globe text-gray-400 w-5 flex-shrink-0 text-sm"></i>
                                    <a href="${escapeHtml(b.website_url)}" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:underline truncate font-semibold">${escapeHtml(b.website_url)}</a>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getCategoryColor(category) {
            switch(category) {
                case 'Technology': return 'bg-blue-100 text-blue-800';
                case 'Trades & Construction': return 'bg-amber-100 text-amber-800';
                case 'Food & Events': return 'bg-pink-100 text-pink-800';
                case 'Professional Services': return 'bg-purple-100 text-purple-800';
                case 'Health & Wellness': return 'bg-emerald-100 text-emerald-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        function filterBusinesses() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const selectedCategory = document.getElementById('categorySelect').value;

            const filtered = allBusinesses.filter(b => {
                const matchesQuery = (b.business_name?.toLowerCase().includes(query)) ||
                                     (b.description?.toLowerCase().includes(query)) ||
                                     (b.category?.toLowerCase().includes(query));
                const matchesCategory = selectedCategory === 'All' || b.category === selectedCategory;
                return matchesQuery && matchesCategory;
            });

            renderBusinesses(filtered);
        }

        function openAddModal() {
            document.getElementById('addBusinessForm').reset();
            document.getElementById('addBusinessModal').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('addBusinessModal').classList.add('hidden');
        }

        async function submitBusiness(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            const businessData = {
                church_id: currentProfile.church_id,
                user_id: currentUser.id,
                business_name: document.getElementById('bizName').value.trim(),
                category: document.getElementById('bizCategory').value,
                description: document.getElementById('bizDescription').value.trim(),
                phone: document.getElementById('bizPhone').value.trim(),
                email: document.getElementById('bizEmail').value.trim(),
                website_url: document.getElementById('bizWebsite').value.trim(),
                status: 'pending',
                is_approved: false
            };

            const { error } = await window.sbClient
                .from('business_directory')
                .insert([businessData]);

            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit Listing';

            if (error) {
                console.error('Error inserting business:', error);
                alert('Failed to add business: ' + error.message);
                return;
            }

            closeAddModal();
            showToast('Business successfully listed in the directory!');
            await fetchBusinesses();
        }

        async function deleteBusiness(id) {
            if (!confirm('Are you sure you want to remove your business listing?')) return;

            const { error } = await window.sbClient
                .from('business_directory')
                .delete()
                .eq('id', id);

            if (error) {
                console.error('Error deleting business:', error);
                alert('Failed to delete listing.');
                return;
            }

            showToast('Business listing removed.');
            await fetchBusinesses();
        }

        function showToast(message) {
            if (typeof showNotification === 'function') {
                showNotification(message, 'success');
            } else {
                alert(message);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag] || tag)
            );
        }

        document.addEventListener('DOMContentLoaded', () => {
            initPage();
        });
    </script>
</body>
</html>
