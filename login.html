<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BelieversMeet</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
</head>
<body class="h-full flex flex-col justify-between font-sans antialiased text-gray-900">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-bold text-indigo-600 hover:text-indigo-500">BelieversMeet</a>
            <div class="text-sm">
                <span class="text-gray-500">New here?</span>
                <a href="signup.html" class="ml-1 font-medium text-indigo-600 hover:text-indigo-500">Sign Up</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-lg border border-gray-100">
            <div>
                <h2 class="text-center text-3xl font-extrabold text-gray-900">Welcome Back</h2>
                <p class="mt-2 text-center text-sm text-gray-600">
                    Log in to access your dashboard.
                </p>
            </div>

            <div id="error-message" class="hidden rounded-md bg-red-50 p-4 text-sm text-red-700 border border-red-200"></div>

            <form id="login-form" class="mt-8 space-y-5">
                <div>
                    <label for="login-email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="login-email" required class="appearance-none rounded-lg relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="name@domain.com">
                </div>

                <div>
                    <label for="login-password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <input type="password" id="login-password" required class="appearance-none rounded-lg relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm pr-16" placeholder="Enter your password">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 px-3 flex items-center text-xs font-medium text-indigo-600 hover:text-indigo-500 focus:outline-none">Show/Hide</button>
                    </div>
                </div>

                <div>
                    <button type="submit" class="group relative w-full flex justify-center py-2.5 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                        Log In
                    </button>
                </div>

                <div class="text-center pt-1">
                    <a href="forgot-password.html" class="text-sm font-medium text-indigo-600 hover:text-indigo-500">Forgot Password?</a>
                </div>

                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-gray-200"></div>
                    <div class="flex-grow border-t border-gray-200"></div>
                </div>

                <div class="text-center pt-2">
                    <p class="text-xs text-gray-500 mb-3">Are you a church leader looking to onboard your congregation?</p>
                    <a href="register-church.html" class="inline-flex items-center justify-center px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-lg text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                        🏰 Register My Church
                    </a>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-auto py-6">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-gray-500">
        &copy; 2026 BelieversMeet. All rights reserved. Building and strengthening faith communities together.
      </div>
    </footer>

    <!-- Script Section -->
    <script>
        async function waitForSupabase() {
            while (!window.sbClient) await new Promise(r => setTimeout(r, 100));
            return true;
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errBox = document.getElementById('error-message');
            errBox.classList.add('hidden');

            await waitForSupabase();

            const btn = document.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = "Logging In...";

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            try {
                const { data, error } = await window.sbClient.auth.signInWithPassword({ email, password });

                if (error) throw error;

                if (data.user) {
                    const isSuperAdmin = data.user.email === 'adoniakasango@gmail.com';
                    if (isSuperAdmin) {
                        window.location.replace('feed.html');
                        return;
                    }

                    const { data: profile, error: profileError } = await window.sbClient
                        .from('profiles')
                        .select('church_id, role')
                        .eq('id', data.user.id)
                        .maybeSingle();

                    if (profile && profile.role === 'super_admin') {
                        window.location.replace('feed.html');
                        return;
                    }

                    if (profileError || !profile || !profile.church_id) {
                        if (profile && profile.role === 'admin') {
                            window.location.replace('register-church.html');
                        } else {
                            window.location.replace('join-church.html');
                        }
                    } else {
                        window.location.replace('feed.html');
                    }
                }
            } catch (err) {
                errBox.textContent = err.message;
                errBox.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = "Log In";
            }
        });

        function togglePasswordVisibility() {
            const p = document.getElementById('login-password');
            p.type = p.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
