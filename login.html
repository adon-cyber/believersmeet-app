<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BelieversMeet</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
</head>
<body class="bg-[url('images/meet2.jpg')] bg-cover bg-center bg-no-repeat bg-fixed flex flex-col min-h-screen text-white relative">

    <!-- Header / Navbar -->
    <header class="bg-black/30 backdrop-blur-sm border-b border-white/10 relative z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-bold text-white hover:text-gray-200">BelieversMeet</a>
            <div class="text-sm">
                <span class="text-gray-300">New here?</span>
                <a href="signup.html" class="ml-1 font-medium text-white underline hover:text-gray-200">Sign Up</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative z-10">
        <div class="max-w-md w-full space-y-8 backdrop-blur-md bg-white/90 dark:bg-slate-900/90 p-8 shadow-2xl rounded-2xl border border-white/20">
            <div>
                <h2 class="text-center text-3xl font-extrabold text-gray-900 dark:text-white">Welcome Back</h2>
                <p class="mt-2 text-center text-sm text-gray-600 dark:text-gray-300">
                    Log in to access your dashboard.
                </p>
            </div>

            <div id="error-message" class="hidden rounded-md bg-red-50 p-4 text-sm text-red-700 border border-red-200"></div>

            <form id="login-form" class="mt-8 space-y-5">
                <div>
                    <label for="login-email" class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Email Address</label>
                    <input type="email" id="login-email" required class="appearance-none rounded-lg relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm bg-white/80 dark:bg-slate-800 dark:text-white dark:border-slate-700" placeholder="name@domain.com">
                </div>

                <div>
                    <label for="login-password" class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Password</label>
                    <div class="relative w-full">
                        <input type="password" id="login-password" required class="appearance-none rounded-lg relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm pr-10 bg-white/80 dark:bg-slate-800 dark:text-white dark:border-slate-700" placeholder="••••••••">
                        <button type="button" onclick="togglePasswordVisibility('login-password', this)" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 focus:outline-none">
                            <svg class="w-5 h-5 eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div>
                    <button type="submit" class="group relative w-full flex justify-center py-2.5 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors shadow-lg">
                        Log In
                    </button>
                </div>

                <div class="text-center pt-1">
                    <a href="forgot-password.html" class="text-sm font-medium text-indigo-600 hover:text-indigo-500">Forgot Password?</a>
                </div>

                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-gray-200 dark:border-gray-700"></div>
                    <div class="flex-grow border-t border-gray-200 dark:border-gray-700"></div>
                </div>

                <div class="text-center pt-2">
                    <p class="text-xs text-gray-600 dark:text-gray-300 mb-3">Are you a church leader looking to onboard your congregation?</p>
                    <a href="register-church.html" class="inline-flex items-center justify-center px-4 py-2 border border-gray-300 dark:border-gray-700 shadow-sm text-sm font-medium rounded-lg text-gray-700 dark:text-gray-200 bg-white/80 dark:bg-slate-800 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                        🏰 Register My Church
                    </a>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-white/10 mt-auto py-6 relative z-10">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-gray-200">
        &copy; 2026 BelieversMeet. All rights reserved. Building and strengthening faith communities together.
      </div>
    </footer>

    <!-- Script Section -->
    <script>
        async function waitForSupabase() {
            while (!window.sbClient && !window.supabase) await new Promise(r => setTimeout(r, 100));
            return window.sbClient || window.supabase;
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errBox = document.getElementById('error-message');
            errBox.classList.add('hidden');

            const sb = await waitForSupabase();

            const btn = document.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = "Logging In...";

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            try {
                const { data, error } = await sb.auth.signInWithPassword({ email, password });

                if (error) throw error;

                if (data.user) {
                    const isSuperAdmin = data.user.email === 'adoniakasango@gmail.com';
                    if (isSuperAdmin) {
                        window.location.replace('super-admin.html');
                        return;
                    }

                    const { data: profile, error: profileError } = await sb
                        .from('profiles')
                        .select('church_id, role')
                        .eq('id', data.user.id)
                        .maybeSingle();

                    if (profile && profile.role === 'super_admin') {
                        window.location.replace('super-admin.html');
                        return;
                    }

                    if (profileError || !profile || !profile.church_id) {
                        if (profile && profile.role === 'admin') {
                            window.location.replace('register-church.html');
                        } else {
                            window.location.replace('join-church.html');
                        }
                    } else {
                        window.location.replace('feed.html');
                    }
                }
            } catch (err) {
                errBox.textContent = err.message;
                errBox.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = "Log In";
            }
        });

        function togglePasswordVisibility(inputId, btnElement) {
            const input = document.getElementById(inputId);
            if (!input) return;
            
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';

            const svg = btnElement.querySelector('svg');
            if (svg) {
                if (isPassword) {
                    // Eye slash icon (hide)
                    svg.innerHTML = `
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                    `;
                } else {
                    // Open eye icon (show)
                    svg.innerHTML = `
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    `;
                }
            }
        }
    </script>
</body>
</html>
