<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BelieversMeet</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
</head>
<body class="bg-slate-950 bg-[url('https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=2000&q=80')] bg-cover bg-center bg-no-repeat bg-fixed flex flex-col min-h-screen text-slate-100 relative antialiased">

    <!-- Dark Overlay for Readability -->
    <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-md z-0 pointer-events-none"></div>

    <!-- Header / Navbar -->
    <header class="bg-slate-950/90 backdrop-blur-xl border-b border-slate-800/80 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 group">
                <img src="images/BELIEVERS.LOGO.png" alt="Logo" class="h-10 w-auto object-contain transform group-hover:scale-105 transition duration-300">
                <span class="text-xl font-black bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">BelieversMeet</span>
            </a>
            <div class="text-sm">
                <span class="text-slate-400">New here?</span>
                <a href="join-church.html" class="ml-1 font-medium text-blue-400 hover:text-blue-300 transition underline">Join Your Church</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative z-10">
        <div class="max-w-md w-full space-y-8 bg-slate-900/90 p-8 shadow-2xl rounded-2xl border border-slate-800 backdrop-blur-xl">
            <div>
                <h2 class="text-center text-3xl font-extrabold text-white">Welcome Back</h2>
                <p class="mt-2 text-center text-sm text-slate-400">
                    Log in to access your dashboard.
                </p>
            </div>

            <div id="error-message" class="hidden rounded-xl bg-red-950/50 p-4 text-sm text-red-300 border border-red-800/60"></div>

            <form id="login-form" class="mt-8 space-y-5">
                <div>
                    <label for="login-email" class="block text-sm font-medium text-slate-300 mb-1">Email Address</label>
                    <input type="email" id="login-email" required class="bm-form-control bg-slate-800/90 border-slate-700 text-white placeholder-slate-500 focus:border-blue-500 focus:ring-blue-500/20" placeholder="name@domain.com">
                </div>

                <div>
                    <label for="login-password" class="block text-sm font-medium text-slate-300 mb-1">Password</label>
                    <div class="relative w-full">
                        <input type="password" id="login-password" required class="bm-form-control bg-slate-800/90 border-slate-700 text-white placeholder-slate-500 focus:border-blue-500 focus:ring-blue-500/20 pr-10" placeholder="••••••••">
                        <button type="button" onclick="togglePasswordVisibility('login-password', this)" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-200 focus:outline-none">
                            <svg class="w-5 h-5 eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div>
                    <button type="submit" class="bm-btn-primary w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl shadow-lg transition-all">
                        Log In
                    </button>
                </div>

                <div class="text-center pt-1">
                    <a href="forgot-password.html" class="text-sm font-medium text-blue-400 hover:text-blue-300 transition">Forgot Password?</a>
                </div>

                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-slate-800"></div>
                </div>

                <div class="text-center pt-2">
                    <p class="text-xs text-slate-400 mb-3">Are you a church leader looking to onboard your congregation?</p>
                    <a href="register-church.html" class="bm-btn-secondary w-full bg-slate-800/80 border-slate-700 text-slate-200 hover:bg-slate-800 hover:text-white">
                        🏰 Register My Church
                    </a>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950/90 border-t border-slate-800/80 mt-auto py-6 relative z-10">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-slate-400">
        &copy; 2026 BelieversMeet. All rights reserved. Building and strengthening faith communities together.
      </div>
    </footer>

    <!-- Script Section -->
    <script>
        const SUPER_ADMIN_ID = '45e7b5df-8f08-4cc7-9356-35e405618329';
    
        async function waitForSupabase() {
            let attempts = 0;
    
            while (
                !window.sbClient &&
                !window.supabase &&
                !window.supabaseClient &&
                attempts < 100
            ) {
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
            }
    
            return window.sbClient || window.supabaseClient || window.supabase;
        }
    
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
    
            const errBox = document.getElementById('error-message');
            const btn = document.querySelector('#login-form button[type="submit"]');
    
            errBox.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'Logging In...';
    
            try {
                const sb = await waitForSupabase();
    
                if (!sb || !sb.auth) {
                    throw new Error('Connection error. Please refresh and try again.');
                }
    
                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;
    
                const { data, error } = await sb.auth.signInWithPassword({
                    email,
                    password
                });
                console.log("LOGIN SESSION CHECK:", {
    hasSession: !!data?.session,
    hasUser: !!data?.user,
    email: data?.user?.email || null,
    userId: data?.user?.id || null,
    error: error?.message || null
});
    
                if (error) throw error;
    
                if (!data.user) {
                    throw new Error('Sign-in could not be completed.');
                }
    
              // Verify Super Admin through the backend RPC and exact UUID.
// If verification fails, stop login routing completely.
if (data.user.id === SUPER_ADMIN_ID) {
    const { data: rpcResult, error: rpcError } =
        await sb.rpc('is_super_admin');

    if (rpcError || rpcResult !== true) {
        throw new Error(
            'Unable to verify Super Admin privileges. Please contact support.'
        );
    }

    window.location.replace('super-admin.html');
    return;
}

// Load the signed-in user's profile.
const { data: profile, error: profileError } = await sb
    .from('profiles')
    .select('church_id, role')
    .eq('id', data.user.id)
    .maybeSingle();

if (profileError) {
    throw new Error(
        'Your account was authenticated, but its profile could not be loaded. Please try again.'
    );
}

if (!profile) {
    throw new Error(
        'Your account profile could not be found. Please contact support.'
    );
}

const role = String(profile.role || '').toLowerCase();
const churchId = profile.church_id;

// Church administrators and finance staff use the admin dashboard.
if (role === 'church_admin' || role === 'admin' || role === 'finance') {
    if (churchId) {
        window.location.replace('admin.html');
    } else if (role === 'church_admin' || role === 'admin') {
        window.location.replace('register-church.html');
    } else {
        throw new Error(
            'Your Finance account is not linked to a church. Please contact your church administrator.'
        );
    }
    return;
}

// Ordinary members without a church use the joining gateway.
if (role === 'member' && !churchId) {
    window.location.replace('join-church.html');
    return;
}

// A member linked to a pending church application should see its status.
if (role === 'member' && churchId) {
    const {
        data: applicationRows,
        error: applicationError
    } = await sb.rpc('get_my_church_application_status');

    if (!applicationError) {
        const application = Array.isArray(applicationRows)
            ? applicationRows[0]
            : applicationRows;

        const applicationStatus = String(
            application?.application_status || ''
        ).toLowerCase();

        if (
            applicationStatus === 'pending' ||
            applicationStatus === 'changes requested'
        ) {
            window.location.replace('church-status.html');
            return;
        }
    }

    // Regular members with an active church membership go to the feed.
    window.location.replace('feed.html');
    return;
}

throw new Error(
    'Your account does not have an eligible access role. Please contact support.'
);
    
            } catch (err) {
                console.error('Login error:', err);
    
                errBox.textContent =
                    err.message || 'Login failed. Please try again.';
    
                errBox.classList.remove('hidden');
    
                btn.disabled = false;
                btn.textContent = 'Log In';
            }
        });
    
        function togglePasswordVisibility(inputId, btnElement) {
            const input = document.getElementById(inputId);
            if (!input) return;
    
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
    
            const svg = btnElement.querySelector('svg');
    
            if (svg) {
                if (isPassword) {
                    svg.innerHTML = `
                        <path stroke-linecap="round" stroke-linejoin="round"
                            stroke-width="2"
                            d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411M21 21l-3.59-3.59"
                        />
                    `;
                } else {
                    svg.innerHTML = `
                        <path stroke-linecap="round" stroke-linejoin="round"
                            stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                        />
                        <path stroke-linecap="round" stroke-linejoin="round"
                            stroke-width="2"
                            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                        />
                    `;
                }
            }
        }
    </script>
  <script src="js/notifications.js"></script>
</body>
</html>
