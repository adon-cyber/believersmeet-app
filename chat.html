<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox & Chat | BelieversMeet</title>
    <link rel="icon" href="images/BELIEVERS.LOGO.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hidden { display: none !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
            /* Chat page visual refinements - existing colour palette preserved */
        #left-sidebar,
        #right-chat-area,
        #active-chat-container {
            min-height: 0;
            min-width: 0;
        }

        #left-sidebar {
            background: #fff;
        }

        #users-directory {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
        }

        #users-directory [id^="user-row-"] {
            padding: 1rem;
            min-height: 76px;
            transition: background-color .2s ease, border-color .2s ease;
        }

        #users-directory [id^="user-row-"]:hover {
            background-color: #eff6ff;
        }

        #chat-header {
            padding: 1rem 1.25rem;
            min-height: 76px;
            border-color: #e5e7eb;
        }

        #target-name {
            line-height: 1.3;
            overflow-wrap: anywhere;
        }

        #messages-container {
            padding: clamp(1rem, 2.5vw, 2rem);
            gap: .9rem;
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
        }

        #messages-container [data-content] > div {
            padding: .8rem 1rem;
            line-height: 1.55;
            font-size: .925rem;
            box-shadow: 0 2px 8px rgba(15, 23, 42, .06);
            overflow-wrap: anywhere;
        }

        #message-form {
            gap: .75rem;
        }

        #message-input {
            min-height: 48px;
            padding: .75rem 1.1rem;
            border-radius: 9999px;
            background: #f9fafb;
            transition: border-color .2s ease, box-shadow .2s ease;
        }

        #message-input:focus {
            background: #fff;
        }

        #send-btn {
            min-height: 48px;
            min-width: 82px;
            border-radius: 9999px;
            font-weight: 600;
        }

        @media (max-width: 767px) {
            #chat-header {
                padding: .8rem 1rem;
                min-height: 68px;
            }

            #messages-container {
                padding: 1rem;
            }

            #message-form {
                gap: .5rem;
            }

            #send-btn {
                min-width: 68px;
                padding-left: 1rem;
                padding-right: 1rem;
            }
        }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/believersmeet-brand.css?v=20261127-v2">
    <link rel="stylesheet" href="css/workspace-nav.css?v=20261128-v2">
<script src="js/church-branding.js?v=20261128-v2"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col overflow-x-hidden text-gray-800 bm-workspace-shell">

<!-- Shared BelieversMeet workspace navigation -->
<div id="navbar"></div>
<script src="js/workspace-nav.js?v=20261128-v2"></script>

<!-- Inbox workspace heading -->
<div class="bm-workspace-page-heading">
    <div>
        <h1>Inbox</h1>
        <p>Stay connected with your church community.</p>
    </div>
</div>

<!-- Main Unified Split-Screen Container -->
<main id="bm-chat-main" class="flex flex-col md:flex-row overflow-hidden bg-white border border-gray-200">
    
    <!-- Left Sidebar (The Inbox List) -->
    <div id="left-sidebar" class="w-full md:w-1/3 md:max-w-sm flex flex-col bg-white border-r border-gray-200 h-full flex-shrink-0">
        <!-- Tabs Header -->
        <div class="flex border-b border-gray-200 bg-white p-3 gap-2 flex-shrink-0">
            <button id="tab-fellow-members" onclick="switchTab('fellow')" class="whitespace-nowrap flex-1 px-4 py-2 rounded-lg font-bold text-xs sm:text-sm bg-blue-600 text-white shadow-sm transition flex items-center justify-center gap-2">
                <i class="fas fa-church"></i> Fellow Church
            </button>
            <button id="tab-other-churches" onclick="switchTab('other')" class="whitespace-nowrap flex-1 px-4 py-2 rounded-lg font-semibold text-xs sm:text-sm text-gray-600 hover:text-gray-900 bg-gray-50 transition flex items-center justify-center gap-2">
                <i class="fas fa-globe"></i> Other Churches
            </button>
            <button id="tab-finance-inquiries" onclick="switchTab('finance')" class="hidden whitespace-nowrap flex-1 px-4 py-2 rounded-lg font-semibold text-xs sm:text-sm text-gray-600 hover:text-gray-900 bg-gray-50 transition flex items-center justify-center gap-2" title="Finance Inquiries">
                <i class="fas fa-wallet"></i> Finance
            </button>
        </div>

        <!-- Scrollable Contacts List -->
        <div id="users-directory" class="flex-1 overflow-y-auto divide-y divide-gray-100">
            <div class="p-6 text-center text-gray-400 text-sm">Loading contacts...</div>
        </div>
    </div>

    <!-- Right Main Area (The Chat Interface) -->
    <div id="right-chat-area" class="flex-1 flex flex-col bg-white relative h-full overflow-hidden">
        
        <!-- Empty State (Shown when no user is selected) -->
        <div id="empty-chat-state" class="flex-1 flex flex-col items-center justify-center p-8 text-center bg-gray-50/50">
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-2xl mb-3 shadow-inner">
                <i class="fas fa-comments"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-800">Select a fellowship contact to start messaging</h3>
            <p class="text-sm text-gray-500 mt-1 max-w-sm">Choose a brother or sister from the list on the left to begin your 1-on-1 direct conversation.</p>
        </div>

        <!-- Active Chat Container (Hidden by default until a user is selected) -->
        <div id="active-chat-container" class="hidden flex-1 flex flex-col h-full overflow-hidden">
            <!-- Chat Header -->
            <div id="chat-header" class="bg-white shadow-sm p-4 flex items-center justify-between border-b flex-shrink-0">
                <div class="flex items-center space-x-3">
                    <button onclick="clearSelectedUser()" class="md:hidden text-blue-600 hover:text-blue-800 p-1.5 rounded-lg bg-gray-100 flex items-center justify-center mr-1" title="Back">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <div class="flex items-center space-x-3">
                        <img id="target-avatar" src="" alt="" class="w-10 h-10 rounded-full object-cover hidden">
                        <div id="target-avatar-placeholder" class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-sm">?</div>
                        <div>
                            <h2 id="target-name" class="font-bold text-gray-900 text-base">Loading...</h2>
                            <p id="target-church-sub" class="text-xs text-gray-500">Direct Message</p>
                        </div>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button id="start-video-call" class="text-blue-600 hover:text-blue-800 p-2.5 rounded-full hover:bg-blue-50 transition-colors" title="Start Video Call">
                        <i class="fas fa-video text-lg"></i>
                    </button>
                </div>
            </div>

            <!-- Message History Container -->
            <div id="messages-container" class="flex-grow bg-gray-50 p-4 overflow-y-auto flex flex-col space-y-3">
                <div class="text-center text-gray-400 py-4">Loading messages...</div>
            </div>

            <!-- Message Input Area -->
            <div class="bg-white shadow p-3 border-t flex-shrink-0">
                <form id="message-form" class="w-full flex gap-2 items-center" onsubmit="sendMessage(event)">
                    <input 
                        type="text" 
                        id="message-input" 
                        placeholder="Type a message..." 
                        required 
                        autocomplete="off"
                        class="flex-grow min-w-0 border border-gray-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                    >
                    <button 
                        type="submit" 
                        id="send-btn"
                        class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-medium hover:bg-blue-700 transition-colors text-sm shadow-sm"
                    >
                        Send
                    </button>
                </form>
            </div>
        </div>

    </div>
</main>

<!-- Video Call Overlay UI -->
<div id="video-call-overlay" class="hidden fixed inset-0 z-50 bg-black flex flex-col justify-between">
    <!-- Remote Video (Full Screen) -->
    <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>

    <!-- Local Video (Floating Smaller View) -->
    <video id="local-video" autoplay muted playsinline class="absolute bottom-20 right-6 w-32 h-48 bg-black rounded-lg border-2 border-white object-cover shadow-lg z-10"></video>

    <!-- Call Control Bar at the bottom -->
    <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/80 to-transparent p-6 flex items-center justify-center space-x-6 z-20">
        <button id="toggle-mic" class="bg-gray-700 hover:bg-gray-600 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg transition-colors" title="Toggle Mic">
            <i class="fas fa-microphone text-lg"></i>
        </button>
        <button id="end-call" class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-full font-bold flex items-center space-x-2 shadow-lg transition-colors" title="End Call">
            <i class="fas fa-phone-slash"></i>
            <span>End Call</span>
        </button>
        <button id="toggle-camera" class="bg-gray-700 hover:bg-gray-600 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg transition-colors" title="Toggle Camera">
            <i class="fas fa-video text-lg"></i>
        </button>
    </div>
</div>

<script>
    let currentUser = null;
    let targetUser = null;
    let activeTab = 'fellow'; // 'fellow' or 'other'
    let activeDepartment = 'general';
    let conversationSelectionVersion = 0;
    let activeChannel = null;

    async function loadChurchLogo() {
        let img = document.getElementById('church-logo-img');

        // The workspace shell renders after its asynchronous auth/profile checks.
        // Wait for its logo element so the church logo loader cannot run too early.
        if (!img) {
            const navbar = document.getElementById('navbar');
            if (navbar) {
                img = await new Promise(resolve => {
                    let timeoutId = null;
                    const observer = new MutationObserver(() => {
                        const found = document.getElementById('church-logo-img');
                        if (found) {
                            observer.disconnect();
                            if (timeoutId !== null) window.clearTimeout(timeoutId);
                            resolve(found);
                        }
                    });

                    observer.observe(navbar, { childList: true, subtree: true });
                    timeoutId = window.setTimeout(() => {
                        observer.disconnect();
                        resolve(document.getElementById('church-logo-img'));
                    }, 10000);
                });
            }
        }

        const placeholder = document.getElementById('church-logo-placeholder');
        if (!img) {
            console.warn('Workspace logo element did not become available; keeping the default page branding.');
            return;
        }

        if (window.BelieversMeetChurchBranding?.refresh) { await window.BelieversMeetChurchBranding.refresh(); return; } // BelieversMeet remains the safe fallback if the member has no church logo.
        img.src = 'images/BELIEVERS.LOGO.png';
        img.alt = 'BelieversMeet logo';
        img.classList.remove('hidden');
        if (placeholder) placeholder.classList.add('hidden');

        const churchId = currentUser?.church_id;
        if (!churchId || !window.sbClient) return;

        try {
            const { data: church, error } = await window.sbClient
                .from('churches').select('logo_url, name').eq('id', churchId).maybeSingle();
            if (error) throw error;
            if (church?.logo_url) {
                const url = new URL(church.logo_url, window.location.href);
                if (['https:', 'http:'].includes(url.protocol)) {
                    img.src = url.href;
                    img.alt = `${church.name || 'Church'} logo`;
                }
            }
        } catch (error) {
            console.warn('Church logo unavailable; using BelieversMeet fallback.', error);
        }
    }

    function switchTab(tab) {
        activeTab = tab;
        const fellowBtn = document.getElementById('tab-fellow-members');
        const otherBtn = document.getElementById('tab-other-churches');
        const financeBtn = document.getElementById('tab-finance-inquiries');

        fellowBtn.className = "whitespace-nowrap flex-1 px-4 py-2 rounded-lg font-semibold text-xs sm:text-sm text-gray-600 hover:text-gray-900 bg-gray-50 transition flex items-center justify-center gap-2";
        otherBtn.className = "whitespace-nowrap flex-1 px-4 py-2 rounded-lg font-semibold text-xs sm:text-sm text-gray-600 hover:text-gray-900 bg-gray-50 transition flex items-center justify-center gap-2";
        if (financeBtn) {
            financeBtn.className = "whitespace-nowrap flex-1 px-4 py-2 rounded-lg font-semibold text-xs sm:text-sm text-gray-600 hover:text-gray-900 bg-gray-50 transition flex items-center justify-center gap-2";
        }

        if (tab === 'fellow') {
            fellowBtn.className = "whitespace-nowrap flex-1 px-4 py-2 rounded-lg font-bold text-xs sm:text-sm bg-blue-600 text-white shadow-sm transition flex items-center justify-center gap-2";
            loadUserDirectory();
        } else if (tab === 'other') {
            otherBtn.className = "whitespace-nowrap flex-1 px-4 py-2 rounded-lg font-bold text-xs sm:text-sm bg-blue-600 text-white shadow-sm transition flex items-center justify-center gap-2";
            loadUserDirectory();
        } else if (tab === 'finance') {
            if (financeBtn) {
                financeBtn.className = "whitespace-nowrap flex-1 px-4 py-2 rounded-lg font-bold text-xs sm:text-sm bg-blue-600 text-white shadow-sm transition flex items-center justify-center gap-2";
            }
            loadFinanceInquiries();
        }
    }

    async function loadFinanceInquiries() {
        if (!currentUser) return;

        const directoryEl = document.getElementById('users-directory');
        if (!directoryEl) return;

        try {
            const { data: threads, error } = await window.sbClient.rpc(
                'get_finance_inquiries'
            );

            if (error) throw error;

            if (!threads || threads.length === 0) {
                directoryEl.innerHTML = `<div class="p-6 text-center text-gray-400 text-sm">No finance inquiries found.</div>`;
                return;
            }

            directoryEl.innerHTML = threads.map(thread => {
                const displayName = escapeHTML(thread.contact_full_name || 'Church Member');
                const lastMessage = escapeHTML(thread.last_message || 'No message content');
                const contactId = thread.contact_id;
                const isSelected = targetUser && targetUser.id === contactId;

                return `
                    <div
                        id="user-row-${contactId}"
                        onclick="selectFinanceUser('${contactId}')"
                        class="p-3.5 hover:bg-blue-50/60 cursor-pointer transition flex items-center gap-3 ${isSelected ? 'bg-blue-50 border-l-4 border-blue-600 font-semibold' : ''}">
                        <div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold text-sm flex-shrink-0 shadow-sm">
                            <i class="fas fa-wallet text-xs"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between">
                                <span class="text-sm font-bold text-gray-900 truncate">${displayName}</span>
                                <span class="text-[10px] bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded font-medium">Finance</span>
                            </div>
                            <p class="text-xs text-gray-500 truncate mt-0.5">${lastMessage}</p>
                        </div>
                    </div>
                `;
            }).join('');

        } catch (error) {
            console.error("Error loading secure finance inquiries:", error);
            directoryEl.innerHTML = `<div class="p-6 text-center text-red-500 text-sm">Error loading finance inquiries.</div>`;
        }
    }
    async function selectFinanceUser(userId) {
        await selectUser(userId, 'finance');
    }

    async function loadUserDirectory() {
        if (!currentUser) return;

        const directoryEl = document.getElementById('users-directory');
        if (!directoryEl) return;

        try {
            const sameChurch = activeTab === 'fellow';

            const { data: profiles, error } = await window.sbClient.rpc(
                'get_chat_directory',
                { p_same_church: sameChurch }
            );

            if (error) throw error;

            if (!profiles || profiles.length === 0) {
                directoryEl.innerHTML = `<div class="p-6 text-center text-gray-400 text-sm">No eligible members found in this tab.</div>`;
                return;
            }

            const churchIds = [...new Set(profiles.map(p => p.church_id).filter(Boolean))];
            const churchMap = {};

            if (churchIds.length > 0) {
                const { data: churchesData, error: churchError } = await window.sbClient
                    .from('church_directory')
                    .select('id, name')
                    .in('id', churchIds);

                if (churchError) throw churchError;

                (churchesData || []).forEach(c => {
                    churchMap[c.id] = c.name;
                });
            }

            directoryEl.innerHTML = profiles.map(p => {
                const displayName = escapeHTML(p.full_name || 'Member');
                const initial = displayName.charAt(0).toUpperCase();
                const avatarUrl = getSafeImageUrl(p.avatar_url);
                const churchName = p.church_id
                    ? (churchMap[p.church_id] || 'Church member')
                    : 'Church member';

                const sameChurchMember =
                    Boolean(currentUser.church_id) &&
                    p.church_id === currentUser.church_id;

                const connected = p.connection_status === 'accepted';
                const canOpen = sameChurchMember || connected;

                let actionHtml = '';

                if (!canOpen) {
                    if (p.connection_status === 'pending') {
                        actionHtml = p.connection_requester_id === currentUser.id
                            ? `<span class="text-xs text-amber-600 font-semibold">Request pending</span>`
                            : `<a href="profile.html" onclick="event.stopPropagation()" class="text-xs font-semibold text-blue-600">Review request</a>`;
                    } else if (
                        p.connection_status === 'rejected' &&
                        p.connection_requester_id !== currentUser.id
                    ) {
                        actionHtml = `<span class="text-xs text-gray-500">Request declined</span>`;
                    } else {
                        actionHtml = `<button type="button" onclick="event.stopPropagation(); requestChatConnection('${p.id}')" class="text-xs font-semibold text-blue-600 hover:text-blue-800">Connect</button>`;
                    }
                } else {
                    actionHtml = connected
                        ? `<span class="text-xs text-green-600 font-semibold">Connected</span>`
                        : '';
                }

                return `
                    <div id="user-row-${p.id}"
                         ${canOpen ? `onclick="selectUser('${p.id}')"` : ''}
                         class="p-3.5 hover:bg-blue-50/60 ${canOpen ? 'cursor-pointer' : 'cursor-default'} transition flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-sm flex-shrink-0 shadow-sm overflow-hidden">

                            ${avatarUrl ? `<img src="${escapeHTML(avatarUrl)}" alt="${displayName}" loading="lazy" class="chat-contact-avatar w-full h-full object-cover">` : ''}

                            <span class="chat-contact-initial ${avatarUrl ? 'hidden' : ''}" aria-hidden="true">${initial}</span>

                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-1.5">
                                <span class="text-sm font-bold text-gray-900 truncate">${displayName}</span>
                                ${p.is_verified ? '<span class="text-blue-500 text-xs" title="Verified">✓</span>' : ''}
                            </div>
                            <p class="text-xs text-gray-500 truncate mt-0.5">${escapeHTML(churchName)}</p>
                        </div>
                        <div class="flex-shrink-0">${actionHtml}</div>
                    </div>
                `;
            }).join('');

            directoryEl.querySelectorAll('.chat-contact-avatar').forEach(img => {
                img.addEventListener('error', () => {
                    img.classList.add('hidden');
                    img.nextElementSibling?.classList.remove('hidden');
                }, { once: true });
            });

        } catch (e) {
            console.error("Error loading secure chat directory:", e);
            directoryEl.innerHTML = `<div class="p-6 text-center text-red-500 text-sm">Error loading contacts.</div>`;
        }
    }

    async function requestChatConnection(userId) {
        if (!currentUser || !userId || userId === currentUser.id) return;

        try {
            const { data: result, error } = await window.sbClient.rpc(
                'request_connection',
                { p_recipient_id: userId }
            );

            if (error) throw error;

            if (!result || !['pending', 'accepted', 'rejected'].includes(result.status)) {
                throw new Error('Unexpected connection response.');
            }

            alert(result.status === 'accepted'
                ? 'You are connected. You can now open the conversation.'
                : result.status === 'pending'
                    ? 'Connection request sent. Chat will be available after acceptance.'
                    : 'The connection request was declined.');

            await loadUserDirectory();
        } catch (error) {
            console.error('Unable to send connection request:', error);
            alert(error.message || 'Could not send the connection request.');
        }
    }
    async function selectUser(userId, departmentOverride = null) {
        if (!userId || !currentUser || !window.sbClient) return;
        const selectionVersion = ++conversationSelectionVersion;

        // Retrieve the contact through the secure directory RPC.
        const { data: contactRows, error } = await window.sbClient.rpc(
            'get_chat_contact',
            { p_user_id: userId }
        );

        if (selectionVersion !== conversationSelectionVersion) return;

        if (error || !contactRows || contactRows.length === 0) {
            console.error('Unable to load authorized chat contact:', error);
            alert("This member is not currently available for chat.");
            return;
        }

        const profile = contactRows[0];

        const sameChurchMember =
            Boolean(currentUser?.church_id) &&
            profile.church_id === currentUser.church_id;

        if (!sameChurchMember && profile.connection_status !== 'accepted') {
            alert("Cross-church messaging requires an accepted connection first.");
            await loadUserDirectory();
            return;
        }

        let churchNameVal = '';
        if (profile.church_id) {
            const { data: churchData, error: churchError } = await window.sbClient
                .from('church_directory')
                .select('name')
                .eq('id', profile.church_id)
                .maybeSingle();

            if (churchError) {
                console.warn('Could not load contact church name:', churchError.message);
            }

            if (churchData) churchNameVal = churchData.name;
        }

        if (selectionVersion !== conversationSelectionVersion) return;

        // Remove the previous conversation subscription before changing targetUser.
        await removeActiveChannel();
        if (selectionVersion !== conversationSelectionVersion) return;

        profile.church_name = churchNameVal;
        targetUser = profile;
        // A finance conversation is selected explicitly; do not inherit a stale URL value.
        const dept = departmentOverride === 'finance' ? 'finance' : 'general';
        activeDepartment = dept;
        
        if (dept === 'finance') {
            window.history.pushState({}, '', `?user=${userId}&department=finance`);
        } else {
            window.history.pushState({}, '', `?user=${userId}`);
        }

        // Update UI highlights
        document.querySelectorAll('[id^="user-row-"]').forEach(el => el.classList.remove('bg-blue-50', 'border-l-4', 'border-blue-600'));
        const activeRow = document.getElementById(`user-row-${userId}`);
        if (activeRow) activeRow.classList.add('bg-blue-50', 'border-l-4', 'border-blue-600');

        // Toggle mobile/desktop view
        applyResponsiveLayout();

        // Populate Chat Header with Department support
        if (dept === 'finance') {
            document.getElementById('target-name').textContent = 'Finance Department';
            document.getElementById('target-church-sub').textContent = targetUser.church_name ? `${targetUser.church_name} - Giving & Finance` : 'Giving & Finance';
        } else {
            document.getElementById('target-name').textContent = targetUser.full_name || 'Member';
            document.getElementById('target-church-sub').textContent = targetUser.church_name || 'Direct Message';
        }

        const avatarImg = document.getElementById('target-avatar');
        const avatarPlaceholder = document.getElementById('target-avatar-placeholder');
        avatarImg.onerror = null;
        if (dept === 'finance') {
            avatarImg.classList.add('hidden');
            avatarPlaceholder.classList.remove('hidden');
            avatarPlaceholder.className = "w-10 h-10 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold text-sm";
            avatarPlaceholder.innerHTML = '<i class="fas fa-wallet"></i>';
        } else if (getSafeImageUrl(targetUser.avatar_url)) {
            avatarImg.onerror = () => {
                if (targetUser?.id !== userId) return;
                avatarImg.classList.add('hidden');
                avatarPlaceholder.classList.remove('hidden');
                avatarPlaceholder.className = "w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-sm";
                avatarPlaceholder.textContent = (targetUser?.full_name || 'U').charAt(0).toUpperCase();
            };
            avatarImg.src = getSafeImageUrl(targetUser.avatar_url);
            avatarImg.classList.remove('hidden');
            avatarPlaceholder.classList.add('hidden');
        } else {
            avatarImg.classList.add('hidden');
            avatarPlaceholder.classList.remove('hidden');
            avatarPlaceholder.className = "w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-sm";
            avatarPlaceholder.textContent = (targetUser.full_name || 'U').charAt(0).toUpperCase();
        }

        // Create a database-authorized video-call invitation.
        const videoBtn = document.getElementById('start-video-call');

        if (videoBtn) {
            videoBtn.onclick = async () => {
                if (!currentUser?.id || !targetUser?.id) {
                    alert('Select a member before starting a video call.');
                    return;
                }

                if (currentUser.id === targetUser.id) {
                    alert('You cannot call yourself.');
                    return;
                }

                const originalTitle = videoBtn.title;
                videoBtn.disabled = true;
                videoBtn.title = 'Sending video-call invitation...';

                try {
                    const { data: invitationId, error } =
                        await window.sbClient.rpc('create_video_call_invitation', {
                            p_recipient_id: targetUser.id
                        });

                    if (error) throw error;

                    if (
                        typeof invitationId !== 'string' ||
                        !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(invitationId)
                    ) {
                        throw new Error('The server returned an invalid call invitation.');
                    }

                    window.location.assign(
                        `video-call.html?invitation=${encodeURIComponent(invitationId)}`
                    );
                } catch (error) {
                    console.error('Unable to create video-call invitation:', error);
                    alert(error.message || 'Could not start the video call. Please try again.');
                } finally {
                    videoBtn.disabled = false;
                    videoBtn.title = originalTitle;
                }
            };
        }

        await fetchMessages();
        if (selectionVersion !== conversationSelectionVersion || targetUser?.id !== userId) return;
        setupRealtimeSubscription();
    }

    async function removeActiveChannel() {
        const channel = activeChannel;
        activeChannel = null;
        if (!channel || !window.sbClient) return;

        try {
            await window.sbClient.removeChannel(channel);
        } catch (error) {
            console.warn('Could not clean up the previous chat subscription:', error);
        }
    }

    function clearSelectedUser() {
        conversationSelectionVersion++;
        void removeActiveChannel();
        targetUser = null;
        activeDepartment = 'general';

        const nextUrl = new URL(window.location.href);
        ['user', 'department', 'prefill'].forEach(key => nextUrl.searchParams.delete(key));
        window.history.pushState({}, '', `${nextUrl.pathname}${nextUrl.search}${nextUrl.hash}`);

        document.querySelectorAll('[id^="user-row-"]').forEach(el => el.classList.remove('bg-blue-50', 'border-l-4', 'border-blue-600'));
        applyResponsiveLayout();
    }

    function applyResponsiveLayout() {
        const leftSidebar = document.getElementById('left-sidebar');
        const rightArea = document.getElementById('right-chat-area');
        const emptyState = document.getElementById('empty-chat-state');
        const activeContainer = document.getElementById('active-chat-container');

        const hasUser = Boolean(targetUser);
        const urlParams = new URLSearchParams(window.location.search);
        const hasUserParam = urlParams.has('user');

        // Check if there is NO ?user=ID in the URL: Hide the Right Main Area (hidden md:flex) and show the Left Sidebar (flex md:flex).
        // If there IS a ?user=ID in the URL: Hide the Left Sidebar (hidden md:flex) and show the Right Main Area (flex md:flex).
        if (!hasUserParam) {
            leftSidebar.className = "w-full md:w-1/3 md:max-w-sm flex flex-col bg-white border-r border-gray-200 h-full flex-shrink-0 flex md:flex";
            rightArea.className = "flex-1 flex flex-col bg-white relative h-full overflow-hidden hidden md:flex";
            emptyState.classList.remove('hidden');
            activeContainer.classList.add('hidden');
        } else {
            leftSidebar.className = "w-full md:w-1/3 md:max-w-sm flex flex-col bg-white border-r border-gray-200 h-full flex-shrink-0 hidden md:flex";
            rightArea.className = "flex-1 flex flex-col bg-white relative h-full overflow-hidden flex md:flex";
            emptyState.classList.add('hidden');
            activeContainer.classList.remove('hidden');
        }
    }

    // Listen to window resize for responsive transitions
    window.addEventListener('resize', () => {
        applyResponsiveLayout();
    });

    async function markMessagesAsRead(senderId) {
        if (!currentUser || !senderId) return;

        try {
            const { error } = await window.sbClient
                .from('messages')
                .update({ is_read: true })
                .eq('sender_id', senderId)
                .eq('is_read', false)
                .or(`receiver_id.eq.${currentUser.id},recipient_id.eq.${currentUser.id}`);

            if (error) throw error;
        } catch (e) {
            console.error("Error marking messages as read:", e);
        }
    }
    async function fetchMessages() {
        if (!currentUser || !targetUser) return;

        const conversationUserId = targetUser.id;
        const currentUserId = currentUser.id;
        const container = document.getElementById('messages-container');

        try {
            const pairFilter =
                `and(sender_id.eq.${currentUserId},receiver_id.eq.${conversationUserId}),` +
                `and(sender_id.eq.${conversationUserId},receiver_id.eq.${currentUserId}),` +
                `and(sender_id.eq.${currentUserId},recipient_id.eq.${conversationUserId}),` +
                `and(sender_id.eq.${conversationUserId},recipient_id.eq.${currentUserId})`;

            const { data: messages, error } = await window.sbClient
                .from('messages')
                .select('*')
                .is('group_id', null)
                .or(pairFilter)
                .order('created_at', { ascending: true });

            if (error) throw error;
            if (targetUser?.id !== conversationUserId || currentUser?.id !== currentUserId) return;

            renderMessages(messages || []);
            await markMessagesAsRead(conversationUserId);

        } catch (e) {
            if (targetUser?.id !== conversationUserId || currentUser?.id !== currentUserId) return;
            console.error("Error fetching messages:", e);
            container.innerHTML = `<div class="text-center text-red-500 py-4">Error loading messages.</div>`;
        }
    }
    function renderMessages(messages) {
        const container = document.getElementById('messages-container');
        if (messages.length === 0) {
            container.innerHTML = `<div class="text-center text-gray-400 py-8">No messages yet. Start the conversation!</div>`;
            return;
        }

        container.innerHTML = messages.map(msg => {
            const isMe = msg.sender_id === currentUser.id;
            const timeStr = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            return `
                <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}" data-content="${escapeHTML(msg.content)}">
                    <div class="max-w-[85%] sm:max-w-md px-4 py-2.5 rounded-2xl text-sm break-words ${isMe ? 'bg-blue-600 text-white rounded-br-none shadow-sm' : 'bg-white text-gray-900 border border-gray-200 rounded-bl-none shadow-sm'}">
                        ${escapeHTML(msg.content)}
                    </div>
                    <span class="text-xs text-gray-400 mt-1 px-1">${timeStr}</span>
                </div>
            `;
        }).join('');

        container.scrollTop = container.scrollHeight;
    }

    async function sendMessage(e) {
        e.preventDefault();

        const input = document.getElementById('message-input');
        const content = input.value.trim();

        if (!content || !currentUser || !targetUser) return;

        const dept = activeDepartment;

        try {
            const insertPayload = {
                sender_id: currentUser.id,
                receiver_id: targetUser.id,
                recipient_id: dept === 'finance' ? targetUser.id : null,
                content: content,
                department: dept
            };

            const { error } = await window.sbClient
                .from('messages')
                .insert([insertPayload]);

            if (error) throw error;

            input.value = '';

            // Refresh from the database after a successful insert.
            await fetchMessages();


        } catch (e) {
            console.error("Error sending message:", e);
            alert("Failed to send message: " + (e.message || 'Please try again.'));
        }
    }
    function setupRealtimeSubscription() {
        if (!targetUser || !currentUser || !window.sbClient) return;

        const subscribedUserId = targetUser.id;
        const subscribedCurrentUserId = currentUser.id;

        activeChannel = window.sbClient
            .channel(`chat-direct-${subscribedCurrentUserId}-${subscribedUserId}`)
            .on('postgres_changes', {
                event: 'INSERT',
                schema: 'public',
                table: 'messages'
            }, payload => {
                const newMsg = payload.new;

                // Ignore late events for a conversation that is no longer selected.
                if (!targetUser || targetUser.id !== subscribedUserId ||
                    !currentUser || currentUser.id !== subscribedCurrentUserId) return;

                const incomingOrOutgoing =
                    (newMsg.sender_id === subscribedCurrentUserId &&
                        (newMsg.receiver_id === subscribedUserId ||
                         newMsg.recipient_id === subscribedUserId)) ||
                    (newMsg.sender_id === subscribedUserId &&
                        (newMsg.receiver_id === subscribedCurrentUserId ||
                         newMsg.recipient_id === subscribedCurrentUserId));

                if (incomingOrOutgoing && !newMsg.group_id) {
                    void fetchMessages();
                }
            })
            .subscribe();
    }

    function getSafeImageUrl(value) {
        if (typeof value !== 'string' || !value.trim()) return '';

        try {
            const parsed = new URL(value, window.location.origin);
            return ['https:', 'http:'].includes(parsed.protocol) ? parsed.href : '';
        } catch (_) {
            return '';
        }
    }

    function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, function(s) {
            return {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[s];
        });
    }

    async function logoutUser(e) {
        e.preventDefault();
        await window.sbClient.auth.signOut();
        window.location.replace('login.html');
    }

    (async () => {
        let retries = 0;
        while (!window.sbClient && retries < 20) { 
            await new Promise(r => setTimeout(r, 200)); 
            retries++; 
        }
        
        if (!window.sbClient) {
            console.error("Supabase client failed to initialize.");
            return;
        }

        const { data: { user } } = await window.sbClient.auth.getUser();
        if (!user) {
            window.location.replace('login.html');
            return;
        }

        const { data: profile } = await window.sbClient.from('profiles').select('*').eq('id', user.id).maybeSingle();
        currentUser = { ...user, role: profile?.role, church_id: profile?.church_id };
        window.believersMeetCurrentUser = currentUser;

        // Show finance tab if user has finance or admin/super_admin role
        const financeBtn = document.getElementById('tab-finance-inquiries');
        if (financeBtn && currentUser && ['finance', 'church_admin', 'admin', 'super_admin'].includes(currentUser.role)) {
            financeBtn.classList.remove('hidden');
        }

        await loadChurchLogo();
        await loadUserDirectory();

        // Resolve the selected conversation and optional message draft.
        const urlParams = new URLSearchParams(window.location.search);
        const initialUserId = urlParams.get('user');
        const prefillParam = urlParams.get('prefill');
        const deptParam = urlParams.get('department');

        if (initialUserId) {
            await selectUser(
                initialUserId,
                deptParam === 'finance' ? 'finance' : null
            );
        } else if (
            deptParam === 'finance' &&
            ['finance', 'admin', 'super_admin'].includes(currentUser.role)
        ) {
            switchTab('finance');
        } else if (deptParam === 'finance') {
            try {
                const { data: financeContacts, error } =
                    await window.sbClient.rpc('get_my_church_finance_contact');

                if (error) throw error;

                const financeContact = financeContacts?.[0];

                if (financeContact?.id) {
                    await selectUser(financeContact.id, 'finance');
                } else {
                    alert('Your church finance contact has not been assigned yet.');
                    applyResponsiveLayout();
                }
            } catch (error) {
                console.error('Unable to load church finance contact:', error);
                alert('Could not open your church finance conversation. Please try again.');
                applyResponsiveLayout();
            }
        } else {
            applyResponsiveLayout();
        }

        // URLSearchParams already decodes the preset message.
        // Fill the composer only; the member must press Send.
        if (prefillParam) {
            const msgInput = document.getElementById('message-input');

            if (msgInput) {
                msgInput.value = prefillParam;
                msgInput.focus();
            }
        }
    })();
</script>
