<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Setup | BelieversMeet</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script>
        // Inverse Logic: If user ALREADY has a church_id, redirect them away to index.html (or feed.html)
        (async function checkAlreadyJoined() {
            async function waitForSupabase() {
                let attempts = 0;
                while (!window.supabaseClient && !window.supabase && !window.sbClient && attempts < 50) {
                    await new Promise(r => setTimeout(r, 50));
                    attempts++;
                }
                return window.supabaseClient || window.supabase || window.sbClient;
            }

            const client = await waitForSupabase();
            if (!client) return;

            const { data: { session } } = await client.auth.getSession();
            if (!session) {
                window.location.replace('login.html');
                return;
            }

            const { data: profile } = await client
                .from('profiles')
                .select('church_id, role')
                .eq('id', session.user.id)
                .maybeSingle();

            const isSuperAdmin = (profile?.role === 'super_admin') || (session.user.email === 'adoniakasango@gmail.com');
            const hasChurch = profile && profile.church_id !== null && profile.church_id !== '';

            if (hasChurch || isSuperAdmin) {
                window.location.replace('index.html');
            } else {
                // Reveal join-church body
                if (document.body) {
                    document.body.style.display = 'flex';
                } else {
                    window.addEventListener('DOMContentLoaded', () => {
                        document.body.style.display = 'flex';
                    });
                }
            }
        })();
    </script>
</head>
<body class="h-full flex flex-col justify-between font-sans antialiased text-gray-900 bg-cover bg-center bg-no-repeat relative" style="display: none; background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('images/meet2.jpg');">

    <!-- Header / Navbar -->
    <header class="bg-white/90 backdrop-blur-md border-b border-white/20 relative z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="feed.html" class="text-xl font-bold text-indigo-600 hover:text-indigo-500">BelieversMeet</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative z-10">
        <div class="max-w-md w-full space-y-8 backdrop-blur-md bg-white/90 dark:bg-slate-900/90 p-8 shadow-2xl rounded-2xl border border-white/20">
            <div>
                <h2 class="text-center text-3xl font-extrabold text-gray-900 dark:text-white">Welcome! Let's get you set up.</h2>
                <p class="mt-2 text-center text-sm text-gray-600 dark:text-gray-300">
                    Enter the Church Code given to you by your church leadership.
                </p>
            </div>

            <div id="error-message" class="hidden rounded-md bg-red-50 p-4 text-sm text-red-700 border border-red-200"></div>

            <form id="setup-form" class="mt-8 space-y-5">
                <div>
                    <label for="church-id-input" class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Church Join Code (e.g., JINJA2026)</label>
                    <input type="text" id="church-id-input" required class="appearance-none rounded-lg relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm bg-white/80 dark:bg-slate-800 dark:text-white dark:border-slate-700" placeholder="e.g., JINJA2026">
                </div>

                <div>
                    <button type="submit" class="group relative w-full flex justify-center py-2.5 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors shadow-lg">
                        Complete Setup
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white/90 backdrop-blur-md border-t border-white/25 mt-auto py-6 relative z-10">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-gray-600 dark:text-gray-300">
        &copy; 2026 BelieversMeet. All rights reserved. Building and strengthening faith communities together.
      </div>
    </footer>

    <script>
        async function waitForSupabase() {
            while (!window.supabase && !window.sbClient) await new Promise(r => setTimeout(r, 100));
            return window.supabase || window.sbClient;
        }

        document.getElementById('setup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errBox = document.getElementById('error-message');
            errBox.classList.add('hidden');

            const churchCode = document.getElementById('church-id-input').value.trim();
            const btn = document.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = "Saving...";

            try {
                const sb = await waitForSupabase();
                const { data: { user } } = await sb.auth.getUser();
                if (!user) {
                    window.location.replace('login.html');
                    return;
                }

                // Query church by code
                const { data: church, error } = await sb
                    .from('churches')
                    .select('id, name')
                    .eq('join_code', churchCode.toUpperCase())
                    .single();

                if (error || !church) {
                    throw new Error("Invalid Church Code. Please check the code with your church leader and try again.");
                }

                const churchUuid = church.id;

                const { error: updateError } = await sb
                    .from('profiles')
                    .update({ church_id: churchUuid, role: 'member' })
                    .eq('id', user.id);

                if (updateError) throw updateError;

                // Securely save to localStorage and update profile before redirecting
                localStorage.setItem('church_id', churchUuid);

                window.location.replace('index.html');
            } catch (err) {
                errBox.textContent = err.message;
                errBox.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = "Complete Setup";
            }
        });
    </script>
</body>
</html>
