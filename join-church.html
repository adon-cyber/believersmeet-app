<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Setup | BelieversMeet</title>
    <!-- Tailwind CSS CDN -->
    
            <script src="js/auth-guard.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="h-full flex flex-col justify-between font-sans antialiased text-gray-900">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-gray-200">
        <div class="glass-card floating-card max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="feed.html" class="text-xl font-bold text-indigo-600 hover:text-indigo-500">BelieversMeet</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="glass-card floating-card max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-lg border border-gray-100">
            <div>
                <h2 class="text-center text-3xl font-extrabold text-gray-900">Welcome! Let's get you set up.</h2>
                <p class="mt-2 text-center text-sm text-gray-600">
                    Enter the Church Code given to you by your church leadership.
                </p>
            </div>

            <div id="error-message" class="hidden rounded-md bg-red-50 p-4 text-sm text-red-700 border border-red-200"></div>

            <form id="setup-form" class="mt-8 space-y-5">
                <div>
                    <label for="church-id-input" class="block text-sm font-medium text-gray-700 mb-1">Church Join Code (e.g., JINJA2026)</label>
                    <input type="text" id="church-id-input" required class="appearance-none rounded-lg relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="e.g., JINJA2026">
                </div>

                <div>
                    <button type="submit" class="group relative w-full flex justify-center py-2.5 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                        Complete Setup
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-auto py-6">
      <div class="glass-card floating-card max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-gray-500">
        &copy; 2026 BelieversMeet. All rights reserved. Building and strengthening faith communities together.
      </div>
    </footer>

    <script>
        async function waitForSupabase() {
            while (!window.sbClient) await new Promise(r => setTimeout(r, 100));
            return true;
        }

        window.addEventListener('load', async () => {
            await waitForSupabase();
            const { data: { user } } = await window.sbClient.auth.getUser();
            if (!user) window.location.replace('login.html');
        });

        document.getElementById('setup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errBox = document.getElementById('error-message');
            errBox.classList.add('hidden');

            const churchCode = document.getElementById('church-id-input').value.trim();
            const btn = document.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = "Saving...";

            try {
                await waitForSupabase();
                const { data: { user } } = await window.sbClient.auth.getUser();
                if (!user) {
                    window.location.replace('login.html');
                    return;
                }

                // Query church by code
                const { data: church, error } = await window.sbClient
                    .from('churches')
                    .select('id, name')
                    .eq('join_code', churchCode.toUpperCase())
                    .single();

                if (error || !church) {
                    throw new Error("Invalid Church Code. Please check the code with your church leader and try again.");
                }

                const churchUuid = church.id;

                const { error: updateError } = await window.sbClient
                    .from('profiles')
                    .update({ church_id: churchUuid, role: 'member' })
                    .eq('id', user.id);

                if (updateError) throw updateError;

                // Securely save to localStorage and update profile before redirecting
                localStorage.setItem('church_id', churchUuid);

                window.location.replace('feed.html');
            } catch (err) {
                errBox.textContent = err.message;
                errBox.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = "Complete Setup";
            }
        });
    </script>
</body>
</html>
