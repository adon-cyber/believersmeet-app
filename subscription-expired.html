<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Trial Expired - BelieversMeet</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
</head>
<body class="bg-[url('images/roo-background.jpg.png')] bg-cover bg-center bg-no-repeat bg-fixed min-h-screen flex flex-col text-white">

    <!-- Main Content Container -->
    <main class="flex-grow flex items-center justify-center px-4 sm:px-6 lg:px-8 py-12">
        <div class="backdrop-blur-md bg-white/90 dark:bg-slate-900/90 shadow-2xl rounded-2xl border border-white/20 p-8 text-center max-w-lg w-full mx-auto my-auto transition-all duration-300">
            
            <!-- Warning / Lock Icon -->
            <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-red-100 dark:bg-red-900/40 text-red-600 dark:text-red-400 mb-6 shadow-inner">
                <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
            </div>

            <!-- Header -->
            <h1 class="text-2xl sm:text-3xl font-black text-gray-900 dark:text-white tracking-tight mb-4">
                Free Trial Expired
            </h1>

            <!-- Descriptive Paragraph -->
            <p class="text-gray-600 dark:text-slate-300 text-base leading-relaxed mb-8">
                Your church's 6-month free trial has ended. To restore access to your workspace and community features, please contact the Super Admin or upgrade your subscription.
            </p>

            <!-- Actions -->
            <div class="space-y-3">
                <a href="mailto:admin@reostec.com" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg hover:shadow-blue-500/30 transition duration-300 inline-block text-center">
                    Contact Support
                </a>
                
                <button onclick="handleLogout()" class="w-full bg-gray-200 hover:bg-gray-300 dark:bg-slate-800 dark:hover:bg-slate-700 text-gray-800 dark:text-slate-200 font-semibold py-3 px-6 rounded-lg transition duration-300 inline-block">
                    Log Out
                </button>
            </div>

        </div>
    </main>

    <!-- Sticky Footer -->
    <footer class="py-6 text-center text-xs text-white/80 backdrop-blur-sm bg-black/20 border-t border-white/10">
        <p>&copy; 2026 BelieversMeet | All Rights Reserved</p>
    </footer>

    <!-- Logout Logic -->
    <script>
        async function handleLogout() {
            if (window.sbClient) {
                await window.sbClient.auth.signOut();
            }
            window.location.href = 'login.html';
        }
    </script>
  <script src="js/notifications.js"></script>
</body>
</html>
